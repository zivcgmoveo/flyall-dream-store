  { id: 'vip',  name: 'VIP',   zone: 'פרקט',      desc: 'רחבת עמידה קדמית, 20 מטר מהבמה',         up: 2500, color: '#F2C230', z: 'floor' }
];
const HOTELS = [
  { id: 'h1', name: 'Pullman Paris La Défense', stars: 4, score: '8.6', reviews: 1240, where: 'לה דפנס · 5 דק׳ הליכה מהארנה', up: 0,    img: 'assets/flow/room-1.jpg', perks: ['ארוחת בוקר כלולה'] },
  { id: 'h2', name: 'Hilton Paris La Défense',  stars: 4, score: '8.4', reviews: 980,  where: 'לה דפנס · 8 דק׳ הליכה מהארנה', up: 350,  img: 'assets/flow/room-2.jpg', perks: ['ארוחת בוקר כלולה', 'בריכה מקורה'] },
  { id: 'h3', name: 'Le Fouquet’s Paris',       stars: 5, score: '9.3', reviews: 612,  where: 'שאנז אליזה · 15 דק׳ במטרו',     up: 1400, img: 'assets/flow/room-3.jpg', perks: ['ארוחת בוקר כלולה', 'ספא'] }
];
const ROOMS = [
  { id: 'r1', name: 'חדר סטנדרט',      size: '17 מ״ר · QUEEN',         guests: 2, up: 0,   img: 'assets/flow/room-1.jpg' },
  { id: 'r2', name: 'חדר דלוקס',       size: '24 מ״ר · KING · נוף לעיר', guests: 2, up: 250, img: 'assets/flow/room-2.jpg' },
  { id: 'r3', name: 'סוויטה ג׳וניור', size: '38 מ״ר · KING + ספה',     guests: 3, up: 900, img: 'assets/flow/room-3.jpg' }
];
const FLIGHTS = [
  { id: 'f1', up: 0,   legs: [['LY 323', 'TLV', '13/05/27 · 08:45', 'CDG', '13/05/27 · 12:50', '5h 05m'], ['LY 324', 'CDG', '15/05/27 · 16:00', 'TLV', '15/05/27 · 21:15', '4h 15m']] },
  { id: 'f2', up: 180, legs: [['LY 325', 'TLV', '13/05/27 · 16:10', 'CDG', '13/05/27 · 20:15', '5h 05m'], ['LY 328', 'CDG', '16/05/27 · 11:30', 'TLV', '16/05/27 · 16:45', '4h 15m']] }
];
const STEPS = ['חבילה', 'מלון', 'חדר', 'טיסה', 'סיכום ותשלום'];
/* as in Figma: after the flight, step 5 asks who the booking is for, then "מעבר להזמנה" opens the checkout
   (its own three steps: פרטי הזמנה · תשלום · אישור) */
const NEXT = ['המשך למלון', 'המשך לחדר', 'המשך לטיסה', 'מעבר להזמנה', 'אישור ותשלום', 'חזרה לעמוד הראשי'];
const LAST = 5;   /* 0–4 the five steps, 5 the confirmation */
const REQ = ['fn', 'ln', 'mail', 'tel'];
const detailsOk = () => REQ.every(k => (S.f[k] || '').trim());

/* nothing is pre-picked: each step's button wakes only once its choice is made */
const S = { step: 0, pax: 1, pack: null, hotel: null, rooms: { r1: 0, r2: 0, r3: 0 }, flight: 'f1', inst: 1, usePts: true, pay: 'dep', terms: false,
  forWho: 'me', news: true, detailsDone: false, f: { fn: 'ענת', ln: 'ישראלי', mail: 'anatisraeli@gmail.com', tel: '052-0000000', efn: 'Anat', eln: 'Israeli' } };
const find = (arr, id) => arr.find(x => x.id === id);
const roomCount = () => Object.values(S.rooms).reduce((a, b) => a + b, 0);
const roomCap = () => ROOMS.reduce((a, r) => a + r.guests * S.rooms[r.id], 0);
const up = (arr, id) => (find(arr, id) || { up: 0 }).up;
const total = () => S.pax * (BASE + up(PACKS, S.pack) + up(FLIGHTS, S.flight))
  + up(HOTELS, S.hotel) + ROOMS.reduce((a, r) => a + r.up * S.rooms[r.id], 0);
const BACK_TO = ['', 'חזרה לבחירת חבילה', 'חזרה לבחירת מלון', 'חזרה לבחירת חדר', 'חזרה לבחירת טיסה'];

/* ================= the ring — one node for the whole flow, so its numbers roll from the last value ================= */
const RC = 2 * Math.PI * 40;
const RING = el('aside', 'rg',
    '<div class="rg__ring"><svg viewBox="0 0 92 92" aria-hidden="true"><defs><linearGradient id="rgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5ECE"/><stop offset=".5" stop-color="#824AEA"/><stop offset="1" stop-color="#F63DE4"/></linearGradient></defs>'
  +   '<circle class="bg" cx="46" cy="46" r="40"/><circle class="fg" cx="46" cy="46" r="40" stroke-dasharray="' + RC + '" stroke-dashoffset="' + RC + '"/></svg>'
  +   '<p class="rg__n"><b>' + fmt(HAVE) + '</b><small>מתוך <span class="v-tot" data-v="0">0</span></small></p></div>'
  + '<div class="rg__tx"><p class="rg__t">ענת, הדרך לחלום כבר התחילה</p>'
  +   '<p class="rg__s" aria-live="polite">נשאר לך לצבור עוד <b class="v-left" data-v="0">0</b> נקודות להגשמת החלום כולו</p>'
  +   '<p class="rg__pp">לאדם בחדר זוגי</p>'
  +   '</div><button class="rg__calc" type="button" aria-label="מחשבון נקודות" title="מחשבון נקודות"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15v2.5M8.5 18h.01M12 18h.01"/></svg></button>');
RING.setAttribute('aria-label', 'הדרך לחלום');

/* ================= the ring's calculator — the lobby's popup, made for this dream =================
   no "when" here: the show is known, so the months are fixed; the answer is measured against this booking's total */
const CALC = (() => {
  const X_IC = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  const scrim = el('div', 'cc-scrim');
  const MIN = 1000, MAX = 20000;
  /* the lobby's calculator, the same design; here the months are known (the show), and the answer is measured against this booking */
  const cc = el('div', 'cc cc--cal',
      '<button class="cc__x" type="button" aria-label="סגירה">' + X_IC + '</button>'
    + '<div class="cc__top"><span class="fa-card" aria-hidden="true"><b>FlyAll</b><i></i><span>•••• 2026</span></span><h4 class="cc__h">כמה נקודות <b>תצברו עד ההופעה?</b></h4></div>'
    + '<div class="cal__row"><p>ההוצאה החודשית שלי בכרטיס</p><b class="cal__amt"></b></div>'
    + '<input class="cal__range" type="range" min="' + MIN + '" max="' + MAX + '" step="500" aria-label="הוצאה חודשית בכרטיס">'
    + '<div class="cal__ends"><span>₪' + fmt(MIN) + '</span><span>₪' + fmt(MAX) + '</span></div>'
    + '<div class="cal__res" aria-live="polite">'
    +   '<p class="cal__lbl">עד ההופעה תצברו · ' + MONTHS + ' חודשים</p>'
    +   '<p class="cal__big"><b class="cal__year"></b><small>נק׳</small></p>'
    +   '<p class="cal__eq">1 נק׳ = ₪1</p>'
    +   '<p class="cal__tot"><span>ביחד עם ה־' + fmt(HAVE) + ' שכבר יש לך</span><b class="cal__all"></b></p>'
    +   '<p class="cc__end"></p></div>'
    + '<a class="cc__go" href="#">חזרה להזמנה</a>');
  cc.setAttribute('role', 'dialog'); cc.setAttribute('aria-modal', 'true'); cc.setAttribute('aria-label', 'מחשבון נקודות');
  document.body.append(scrim, cc);
  const q = c => cc.querySelector(c);
  let spend = 0, wasOk = false;
  /* our light green confetti, from the green line, each time the spend comes to cover the booking */
  const greenConfetti = from => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const r = from.getBoundingClientRect(), box = el('div', 'confetti');
    box.style.zIndex = 400;
    box.style.left = (r.left + r.width / 2) + 'px'; box.style.top = (r.top + r.height / 2) + 'px';
    const C = ['#14A160', '#3CCB7F', '#7EE2A8', '#B8F2CF', '#D9F7E6'];
    for (let i = 0; i < 30; i++) {
      const c = el('i');
      c.style.background = C[i % C.length];
      if (i % 3 === 0) c.style.borderRadius = '50%';
      box.appendChild(c);
      const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 90, x = Math.cos(a) * d, y = Math.sin(a) * d - 30;
      c.animate([
        { transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 },
        { transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + (Math.random() * 360) + 'deg) scale(1)', opacity: .9, offset: .45 },
        { transform: 'translate(' + (x * 1.15) + 'px,' + (y + 60) + 'px) rotate(' + (Math.random() * 540) + 'deg) scale(.6)', opacity: 0 }
      ], { duration: 1500 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 2600);
  };
  const roll = (node, to) => {
    const from = node._v || 0, t0 = performance.now();
    cancelAnimationFrame(node._raf);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { node._v = to; node.textContent = fmt(to); return; }
    const step = now => {
      const k = Math.min(1, (now - t0) / 350);
      node._v = from + (to - from) * (1 - Math.pow(1 - k, 3)); node.textContent = fmt(node._v);
      if (k < 1) node._raf = requestAnimationFrame(step);
    };
    node._raf = requestAnimationFrame(step);
  };
  const range = q('.cal__range');
  const draw = () => {
    const earn = spend * MONTHS * RATE, tot = HAVE + earn, t = total(), left = Math.max(0, t - tot);
    q('.cal__amt').textContent = '₪' + fmt(spend);
    range.value = spend;
    range.style.setProperty('--p', ((spend - MIN) / (MAX - MIN) * 100).toFixed(1) + '%');
    roll(q('.cal__year'), earn);
    q('.cal__all').textContent = fmt(tot) + ' נק׳';

    wasOk = !left;

    end.innerHTML = left
      ? 'ההזמנה: <b>' + fmt(t) + ' נק׳</b> · נשאר להשלים <b>' + fmt(left) + ' נק׳</b>, בנקודות או בכסף'

  };

  /* it opens on the spend that would cover this booking, rounded to ₪500 */

function countTo(node, to) {
  const from = +node.dataset.v || 0;
  node.dataset.v = to;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || from === to) { node.textContent = fmt(to); return; }
  const t0 = performance.now(), DUR = 650;
  const step = now => {
    const p = Math.min(1, (now - t0) / DUR), k = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(from + (to - from) * k);
    if (p < 1 && +node.dataset.v === to) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function drawRing() {
  const t = total();
  RING.querySelector('.fg').style.strokeDashoffset = String(RC * (1 - Math.min(1, HAVE / t)));
  countTo(RING.querySelector('.v-tot'), t);
  countTo(RING.querySelector('.v-left'), Math.max(0, t - HAVE));
}

/* ================= the confirmation's little celebration ================= */
/* a plane loops over the card, the tick pops, and a soft burst of brand-coloured confetti follows */
function celebrate() {
  const card = app.querySelector('.booked');
  if (!card || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (card) card.classList.add('still'); return; }
  const path = card.querySelector('.booked__arc'), plane = card.querySelector('.booked__plane'), sky = card.querySelector('.booked__sky');
  const L = path.getTotalLength();
  path.style.strokeDasharray = L + ' ' + L; path.style.strokeDashoffset = L;
  const t0 = performance.now() + 250, DUR = 1500;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0) / DUR)), k = 1 - Math.pow(1 - p, 3);
    const a = path.getPointAtLength(L * k), b = path.getPointAtLength(Math.min(L, L * k + 1));
    const r = sky.getBoundingClientRect(), c = card.getBoundingClientRect(), sx = r.width / 400, sy = r.height / 120;
    const ang = Math.atan2((b.y - a.y) * sy, (b.x - a.x) * sx) * 180 / Math.PI + 90;
    plane.style.transform = 'translate(' + (r.left - c.left + a.x * sx - 14) + 'px,' + (r.top - c.top + a.y * sy - 14) + 'px) rotate(' + ang + 'deg)';
    plane.style.opacity = p <= 0 ? '0' : p > .92 ? String((1 - p) / .08) : '1';
    path.style.strokeDashoffset = String(L * (1 - k));
    if (p < 1) return requestAnimationFrame(step);
    card.classList.add('landed');
    burst(card.querySelector('.booked__ic'));
  };
  requestAnimationFrame(step);
}
function burst(from) {
  const r = from.getBoundingClientRect(), box = el('div', 'confetti');
  box.style.left = (r.left + r.width / 2) + 'px'; box.style.top = (r.top + r.height / 2) + 'px';
  const C = ['#1B5ECE', '#824AEA', '#F63DE4', '#FFC94D', '#7EE2A8', '#B9A6EE'];
  for (let i = 0; i < 34; i++) {
    const c = el('i');
    c.style.background = C[i % C.length];
    if (i % 3 === 0) c.style.borderRadius = '50%';
    box.appendChild(c);
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.4, d = 60 + Math.random() * 90, x = Math.cos(a) * d, y = Math.sin(a) * d;
    c.animate([
      { transform: 'translate(0,0) rotate(0) scale(.6)', opacity: 1 },
      { transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + (Math.random() * 360) + 'deg) scale(1)', opacity: 1, offset: .4 },
      { transform: 'translate(' + (x * 1.1) + 'px,' + (y + 90) + 'px) rotate(' + (Math.random() * 600) + 'deg) scale(.7)', opacity: 0 }
    ], { duration: 1700 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2800);
}

/* ================= render ================= */
const app = document.getElementById('app');
function render(scroll) {
  const t = total();
  app.innerHTML = '';
  const steps = el('nav', 'st');
  steps.setAttribute('aria-label', 'שלבי ההזמנה');
  /* the booking steps, or — once in the checkout — the checkout's own three */
  const list = STEPS, cur = S.step;
  steps.innerHTML = '<div class="st__row">' + list.map((n, i) => (i ? '<i class="st__ln' + (i <= cur ? ' done' : '') + '"></i>' : '')
    + '<span class="st__i' + (i < cur ? ' done' : i === cur ? ' on' : '') + '" data-go="' + i + '"' + (i === cur ? ' aria-current="step"' : '') + '><b>' + (i < cur ? IC.check : i + 1) + '</b><span>' + n + '</span></span>').join('') + '</div>';
  /* the way home, as on the category page: a small pill, top right */
  /* not on the confirmation — its own button at the bottom leads home */
  if (S.step !== LAST) app.appendChild(el('p', 'homerow', '<a class="lead__home" href="pov-reels-v2.html">'
    + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
    + 'חזרה לעמוד הראשי</a>'));
  app.appendChild(steps);
  const cta = S.step === LAST ? '<a class="ds-btn ds-btn--secondary-grad act__back" href="pov-reels-v2.html">' + NEXT[S.step] + '</a>'
    : S.step === 4 && !S.detailsDone
      ? '<a class="ds-btn ds-btn--primary" href="#" data-details' + (detailsOk() ? '' : ' aria-disabled="true"') + '>המשך לתשלום</a>'
      : '<a class="ds-btn ds-btn--primary" href="#" data-next' + (canGo() ? '' : ' aria-disabled="true"') + '>' + NEXT[S.step] + '</a>';
  const grid = el('div', 'grid');
  const side = grid.appendChild(el('aside', 'side', sideHTML()));
  side.prepend(RING);
  const main = el('section', 'main');
  main.appendChild(el('div', 'panel', STEP_UI[S.step]()));
  /* the step's button, in the bar stuck to the foot of the screen */
  main.appendChild(el('div', 'act', cta));
  grid.appendChild(main);
  app.appendChild(grid);
  requestAnimationFrame(drawRing);
  if (scroll) window.scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  if (S.step === LAST) celebrate();
  /* mobile, from the second step on: the photo card goes, and the ring sticks under the stepper */
  document.body.classList.toggle('past1', S.step > 0);
  const stH = () => document.documentElement.style.setProperty('--st-h', steps.getBoundingClientRect().height + 'px');
  stH(); requestAnimationFrame(stH);
}
function go(i) {
  S.step = Math.max(0, Math.min(LAST, i));
  history.replaceState(null, '', '#' + (S.step + 1));
  render(true);
}
app.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('[data-inst]')) { S.inst = +t.closest('[data-inst]').dataset.inst; return render(); }   /* before the option it sits in */
  const pick = t.closest('[data-pick]');
  if (pick) {
    const id = pick.dataset.pick;
    if (S.step === 0) S.pack = id; else if (S.step === 1) S.hotel = id; else if (S.step === 3) S.flight = id;
    else if (S.step === 4 && (id === 'dep' || id === 'full')) S.pay = id;
    else if (S.step === 4) {
      if (id !== S.forWho) Object.assign(S.f, id === 'other'
        ? { fn: '', ln: '', efn: '', eln: '' }
        : { fn: 'ענת', ln: 'ישראלי', efn: 'Anat', eln: 'Israeli' });
      S.forWho = id;
    }
    return render();
  }
  if (t.closest('[data-pax]')) { S.pax = Math.max(1, Math.min(6, S.pax + +t.closest('[data-pax]').dataset.pax)); return render(); }
  if (t.closest('[data-room]')) { const b = t.closest('[data-room]'); S.rooms[b.dataset.room] = Math.max(0, Math.min(4, S.rooms[b.dataset.room] + +b.dataset.d)); return render(); }
  if (t.closest('[data-pts]')) { S.usePts = !S.usePts; return render(); }
  /* the details fold, and the payment opens under them — same step, no new page */
  if (t.closest('[data-details]')) {
    e.preventDefault();
    if (!detailsOk()) return;
    S.detailsDone = true; render();
    history.pushState({ pay: 1 }, '', location.hash);   /* the browser's back returns to the summary */
    const pw = app.querySelector('.paywrap');
    if (pw) pw.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  if (t.closest('[data-edit]')) { e.preventDefault(); S.detailsDone = false; S.terms = false; return render(); }
  if (t.closest('[data-next]')) { e.preventDefault(); if (canGo() && S.step < LAST) go(S.step + 1); return; }
  if (t.closest('[data-back]')) { e.preventDefault(); go(S.step - 1); return; }
  if (t.closest('[data-out]') && /pov-(reels|category|all)/.test(document.referrer)) { e.preventDefault(); history.back(); return; }
  const st = t.closest('.st__i.done');
  if (st) go(+st.dataset.go);
});
addEventListener('popstate', () => { if (S.step === 4 && S.detailsDone) { S.detailsDone = false; S.terms = false; render(); } });
app.addEventListener('change', e => {
  if (e.target.matches('[data-terms]')) { S.terms = e.target.checked; render(); }
  if (e.target.matches('[data-news]')) S.news = e.target.checked;
});
/* typed details survive re-renders; the button wakes as soon as the required ones are in */
app.addEventListener('input', e => {
  if (!e.target.matches('[data-f]')) return;
  S.f[e.target.dataset.f] = e.target.value;
  const b = app.querySelector('[data-details]');
  if (b) detailsOk() ? b.removeAttribute('aria-disabled') : b.setAttribute('aria-disabled', 'true');
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-pick]')) { e.preventDefault(); e.target.click(); }
});
S.step = Math.max(0, Math.min(LAST, (parseInt(location.hash.slice(1), 10) || 1) - 1));
if (S.step > 0) S.pack = 'base';
if (S.step > 1) S.hotel = 'h1';
if (S.step > 2) S.rooms.r1 = 1;
if (S.step > 3) S.flight = 'f1';
render();

</script>
