<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlyAll — קטגוריה</title>
<style>

/* ---- brand face ---- */
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-ultralight-aaa.otf') format('opentype');font-weight:200;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-light-aaa.otf') format('opentype');font-weight:300;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-regular-aaa.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-medium-aaa.otf') format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-demibold-aaa.otf') format('opentype');font-weight:600;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-bold-aaa.otf') format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-ultrabold-aaa.otf') format('opentype');font-weight:800;font-display:swap}
@font-face{font-family:'Ploni';src:url('assets/fonts/ploni-black-aaa.otf') format('opentype');font-weight:900;font-display:swap}

/* ============================================================
   FLYALL DESIGN SYSTEM — tokens (Figma: FlyAll – New Design / Design System)
   ============================================================ */
@font-face{font-family:'Almoni';src:url('assets/fonts/almoni-dl-aaa-400.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Almoni';src:url('assets/fonts/almoni-dl-aaa-700.ttf') format('truetype');font-weight:700;font-display:swap}
:root{
  /* colours */
  --ds-blue:#1B5ECE;  --ds-blue-hover:#3D76D5;  --ds-blue-press:#1855B9;
  --ds-purple:#824AEA; --ds-pink:#F63DE4;
  --ds-gradient:linear-gradient(90deg,#1B5ECE 0%,#824AEA 50.481%,#F63DE4 100%);
  --ds-black:#040F21; --ds-white:#FFFFFF; --ds-gray:#818790;
  --ds-light-blue-1:#F0F8FF; --ds-light-blue-2:#E3F2FF;
  --ds-bg:#FDFDFD; --ds-cal-blue:#1E5CB3; --ds-step-off:#E6E7E9;

  /* fonts — text styles are Almoni, buttons are Ploni */
  --ds-font:'Almoni','Ploni',system-ui,sans-serif;
  --ds-font-btn:'Ploni',system-ui,sans-serif;

  /* type scale (Mobile) — use as  font: var(--ds-body3);  */
  --ds-body1:      400 12px/normal var(--ds-font);
  --ds-body1-demi: 600 12px/normal var(--ds-font);
  --ds-body1-bold: 700 12px/normal var(--ds-font);
  --ds-body2:      400 14px/16px   var(--ds-font);
  --ds-body2-demi: 600 14px/normal var(--ds-font);
  --ds-body2-bold: 700 14px/normal var(--ds-font);
  --ds-body3:      400 16px/20px   var(--ds-font);
  --ds-body3-demi: 600 16px/16px   var(--ds-font);
  --ds-body3-bold: 700 16px/normal var(--ds-font);
  --ds-body4:      400 18px/20px   var(--ds-font);
  --ds-body4-demi: 600 18px/18px   var(--ds-font);
  --ds-body4-bold: 700 18px/normal var(--ds-font);
  --ds-body5:      400 20px/24px   var(--ds-font);
  --ds-h1:         700 26px/normal var(--ds-font);
  --ds-h2:         600 24px/normal var(--ds-font);
  --ds-h3:         700 20px/22px   var(--ds-font);
  --ds-20-demi:    600 20px/22px   var(--ds-font);
  --ds-btn:        700 18px/20px   var(--ds-font-btn);
}

/* ---- buttons ---- */
.ds-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:44px; padding:6px 16px; border-radius:22px; border:0;
  font:var(--ds-btn); color:#fff; white-space:nowrap; text-decoration:none;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.ds-btn--block{ display:flex; width:100%; }
/* Primary 1 — gradient */
.ds-btn--primary{ background-image:var(--ds-gradient); }
.ds-btn--primary:hover{ background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)),var(--ds-gradient); }
.ds-btn--primary:active{ background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),var(--ds-gradient); }
/* Primary 2 — solid blue */
.ds-btn--blue{ background:var(--ds-blue); }
.ds-btn--blue:hover{ background-image:linear-gradient(rgba(255,255,255,.15),rgba(255,255,255,.15)); }
.ds-btn--blue:active{ background-image:linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)); }
/* Secondary — white, 1.5px blue outline */
.ds-btn--secondary{ background:#fff; border:1.5px solid var(--ds-blue); color:var(--ds-blue); }
.ds-btn--secondary:hover{ border-color:var(--ds-blue-hover); color:var(--ds-blue-hover); }
.ds-btn--secondary:active{ border-color:var(--ds-blue-press); color:var(--ds-blue-press); }
/* Secondary · gradient stroke (Figma 4691:357424) — white fill, 1.5px brand-gradient border, blue label */
.ds-btn--secondary-grad{ border:1.5px solid transparent; color:var(--ds-blue);
  background:linear-gradient(#fff,#fff) padding-box, var(--ds-gradient) border-box; }
.ds-btn--secondary-grad:hover{ color:var(--ds-blue-hover); }
.ds-btn--secondary-grad:active{ color:var(--ds-blue-press); }
.ds-btn:disabled,.ds-btn[aria-disabled="true"]{ opacity:.5; pointer-events:none; }
.ds-btn svg{ width:16px; height:16px; flex:none; }

/* Outline / text link — "הצג הכל" + 16px chevron, 4px gap */
.ds-link{
  display:inline-flex; align-items:center; gap:4px;
  font:var(--ds-body3-bold); color:var(--ds-blue); text-decoration:none;
  background:none; border:0; padding:0; cursor:pointer;
}
.ds-link:hover{ color:var(--ds-blue-hover); text-decoration:underline; }
.ds-link:active{ color:var(--ds-blue-press); text-decoration:underline; }
.ds-link svg{ width:16px; height:16px; flex:none; }

/* Chip — Filter & Sort */
.ds-chip{
  display:inline-flex; align-items:center; gap:4px;
  height:32px; padding:8px 12px; border-radius:60px;
  border:1px solid var(--ds-blue); background:#fff;
  font:var(--ds-body3); color:var(--ds-black); white-space:nowrap;
}
.ds-chip.is-on{ background:var(--ds-light-blue-1); }
.ds-chip--ai{
  border:1.5px solid var(--ds-black); gap:2px;
  background-image:linear-gradient(90deg,rgba(27,94,206,.15),rgba(130,74,234,.15) 50.481%,rgba(246,61,228,.15)),linear-gradient(#fff,#fff);
}

/* Step indicator — 24px circle, Ploni Bold 12 digit, Body1 label */
.ds-step{ width:24px; height:24px; border-radius:75px; display:inline-flex; align-items:center; justify-content:center;
  background:var(--ds-step-off); color:var(--ds-gray); font:700 12px/normal var(--ds-font-btn); }
.ds-step.is-on,.ds-step.is-done{ background:var(--ds-blue); color:#fff; }

/* ============================================================
   FLYALL — TOP NAVIGATION BAR
   Reference: Hader.svg, authored at 390 x 123 (iPhone 13/14 logical width).
   Every number below is traced from that file.
   ============================================================ */

:root {
  --fa-font: 'Ploni', system-ui, sans-serif;
  --fa-ink: #1B5ECE;                 /* single UI colour: logo, avatar, points, menu */
  --fa-grad-a: #1B5ECE;
  --fa-grad-b: #824AEA;              /* stop at 50.48% */
  --fa-grad-c: #F63DE4;

  --fa-bar-h: 64px;                  /* fixed: bar height does NOT scale */
  --fa-bar-radius: 16px;
  --fa-pad: 20px;                    /* physical side padding */

  --fa-notch-w: 33.846%;             /* 132 / 390 — scales with viewport width */
  --fa-notch-ratio: 132 / 42.9006;   /* 63.7988 -> 106.6994 */
  --fa-notch-top: 63.8px;            /* meets the bar's bottom edge */

  --fa-orb-size: 25.7576%;           /* 34 / 132 of the notch — scales with it.
                                        To pin the orb at a fixed 34px instead,
                                        set: --fa-orb-size: 34px */
  --fa-orb-left: 36.29%;             /* 47.903 / 132 */
  --fa-orb-top: 3.651%;              /* 1.5664 / 42.9006 */

  /* type trims, measured against Hader.svg with Ploni */
  --fa-points-nudge: -0.767px;
  --fa-points-baseline: 13px;        /* box top -> baseline, at 16.3px/1 */
  --fa-avatar-nudge: 0.13px;
  --fa-z: 100;
}

/* ---- shell ------------------------------------------------ */
.fa-header {
  position: sticky;
  top: 0;
  z-index: var(--fa-z);
  height: var(--fa-bar-h);
  direction: ltr;                    /* the bar is NOT mirrored in RTL */
  -webkit-user-select: none;
  user-select: none;
}

/* ---- layer 0 : ambient glow + stars (behind the white bar) -- */
.fa-header__decor {
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  z-index: 0;
  pointer-events: none;
}
.fa-header__decor svg { display: block; width: 100%; height: auto; }

/* ---- layer 1 : the white silhouette (bar + notch share one shadow) ---- */
.fa-header__shape {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 1;
  filter: drop-shadow(0 4px 4px rgba(0, 0, 0, .25));
  pointer-events: none;
}
.fa-header__bar {
  height: var(--fa-bar-h);
  background: #fff;
  border-radius: 0 0 var(--fa-bar-radius) var(--fa-bar-radius);
}
.fa-header__notch {
  position: absolute;
  top: var(--fa-notch-top);
  left: 50.128%;                     /* the traced shape sits 0.5px right of centre */
  transform: translateX(-50%);
  width: var(--fa-notch-w);
  aspect-ratio: var(--fa-notch-ratio);
}
.fa-header__notch svg { display: block; width: 100%; height: 100%; }

/* the orb needs its own stacking layer: translateX(-50%) on .fa-header__notch
   makes it a stacking context, so a z-index on the child alone stays trapped inside */
.fa-header__notch--orb { z-index: 3; pointer-events: none; }

/* ---- layer 2 : controls ------------------------------------ */
.fa-header__content {
  position: relative;
  z-index: 2;
  height: var(--fa-bar-h);
}

.fa-header__left {
  position: absolute;
  left: 20.4px;
  top: 0;
  height: var(--fa-bar-h);
  display: flex;
  align-items: center;
}

/* avatar — 24px circle + 1.2px ring (outer 25.2) */
.fa-avatar {
  width: 25.2px;                     /* 24 + 1.2 ring, matching the SVG stroke */
  height: 25.2px;
  box-sizing: border-box;
  border: 1.2px solid var(--fa-ink);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--fa-ink);
  background: none;
  padding: 0;
  cursor: pointer;
}
/* traced ink: 14.590 x 7.482, centred on the circle, baseline y 35.732 */
.fa-avatar__txt {
  font: 700 11.79px/1 var(--fa-font);
  transform: translateY(var(--fa-avatar-nudge));
}

/* points — the underline means it is a link */
.fa-points {
  margin-left: 10.07px;
  display: flex;
  align-items: center;
  text-decoration: none;
  color: var(--fa-ink);
  cursor: pointer;
}
.fa-points__value {
  /* traced: ink 20.808 x 8.620 at (56.484, 27.465) · baseline y 36.085
              underline 22.320 x 0.641 at (55.674, 38.031)
     min-width pins the underline (and the coin icon after it) to the traced
     box; longer balances simply grow past it. */
  font: 700 16.3px/1 var(--fa-font);
  display: inline-block;
  position: relative;
  min-width: 22.32px;
  text-align: center;
  transform: translateY(var(--fa-points-nudge));
}
/* the underline is hung off the baseline, not off the box, so a font swap
   moves it correctly instead of silently drifting */
.fa-points__value::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: calc(var(--fa-points-baseline) + 1.946px);
  height: .641px;
  background: currentColor;
}

.fa-points__coins {
  margin-left: 4.63px;
  width: 18.75px;
  height: 13.75px;
  display: block;
  fill: var(--fa-ink);
}

/* logo — centred on the page, not between its neighbours */
.fa-logo {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 18.998px;
  width: 88.889px;
  height: 26.009px;
  display: block;
}

/* menu — 24 x 17.5 visual box, 20px from the right edge */
.fa-menu {
  position: absolute;
  right: var(--fa-pad);
  top: 22.498px;
  width: 24px;
  height: 17.5px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.fa-menu svg { display: block; width: 100%; height: 100%; }

/* generous touch targets without changing the visuals */
.fa-avatar::after, .fa-menu::after, .fa-points::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 44px; height: 44px;
  transform: translate(-50%, -50%);
}
.fa-avatar, .fa-points { position: relative; }   /* .fa-menu is already absolute */

/* ---- layer 3 : the orb (SOL) ------------------------------- */
.fa-orb {
  position: absolute;
  pointer-events: auto;
  left: var(--fa-orb-left);
  top: var(--fa-orb-top);
  width: var(--fa-orb-size);
  aspect-ratio: 1;
  border: 0;
  padding: 0;
  border-radius: 50%;
  background: #fff url("assets/orb.png") center / cover no-repeat;
  box-shadow: 0 1px 7.6px rgba(136, 73, 234, .5),
              inset 0 -1px 38.2px rgba(27, 94, 206, .11);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

@media (prefers-reduced-motion: no-preference) {
  .fa-orb { transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .fa-orb:active { transform: scale(.92); }
}

.fa-sr {
  position: absolute; width: 1px; height: 1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}



/* ============================================================
   P.O.V. — direction D (Arc). Type: Ploni AAA (200–900).
   ============================================================ */
:root{
  --fa-display: var(--fa-font);
  --stage-h: calc(100svh - var(--fa-bar-h));
  --notch-clear: 48px;            /* the header tongue hangs 43px below the bar */
  --ease: cubic-bezier(.22,.9,.24,1);
  --ink: var(--ds-black);

  /* the dream palette — the three brand hues, and the pale tint ramp the
     page background is built from. The blooms stay barely-there tints: the
     light, happy backdrop is the point, not the colour. */
  --c-blue:    var(--ds-blue);
  --c-purple:  var(--ds-purple);
  --c-magenta: var(--ds-pink);
  --t-sky-1:   #EFEDFF;
  --t-sky-2:   #F7F0FB;
  --t-sky-3:   #FBF1FA;
  --t-sky-4:   #FFF6ED;
}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;background:var(--ds-bg)}
body{position:relative}   /* the backdrop stretches over the whole document */
body{font-family:var(--fa-display);color:#fff}
img,video{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--ds-bg)}
#stage{position:relative;z-index:1}
.scrim{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to top, rgba(6,7,16,.92) 0%, rgba(6,7,16,.56) 34%, rgba(6,7,16,0) 68%),
            linear-gradient(to bottom, rgba(6,7,16,.42) 0%, transparent 26%)}
.kicker{font:var(--ds-body1-bold);opacity:.7}
.meta{font:var(--ds-body1);opacity:.66}
.title{font-weight:700;letter-spacing:0;line-height:1;margin:2px 0}
.cta{transition:transform .18s var(--ease)}
.cta:active{transform:scale(.97)}

/* ============ D · ARC ============ */
.arc{display:flex;flex-direction:column;padding-bottom:0}
/* 917 artboard = 64 bar + 90 + 156 (headline) + 53 + 443 (card) + 20 + 91 */
.arc .lead{--pf:'Ploni',system-ui,sans-serif;padding:88px 20px 0;text-align:center;
 color:var(--ink);font-family:var(--pf);display:flex;flex-direction:column;align-items:center}
.arc h2{margin:0;font:300 72px/72px var(--pf);letter-spacing:0}
.arc .l1{display:block;font-weight:300}
.arc .l2{display:block;font-weight:300}
.arc .l2 b{font-weight:700}
.arc .lead__sub{margin:14px 0 0;font:400 17px/1.4 var(--pf);color:var(--ds-gray)}
.arc .lead__cta{margin-top:22px;width:100%;max-width:300px;height:52px;border-radius:26px;font-family:var(--pf)}
.arc .track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
 overflow-y:hidden;
 padding:72px calc(50% - 36vw) 128px;scrollbar-width:none;align-items:center;
 /* the cards' shadow runs into the bottom padding; fade it out there instead of
    letting the rail's clip edge cut it off in a hard line */
 -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 96px),transparent);
 mask-image:linear-gradient(to bottom,#000 calc(100% - 96px),transparent)}
.arc .track::-webkit-scrollbar{display:none}
.arc .cell{flex:none;width:72vw;aspect-ratio:9/14.2;scroll-snap-align:center;
 border-radius:24px;overflow:hidden;position:relative;background:#11121C;
 transition:filter .4s var(--ease), opacity .4s var(--ease);will-change:transform;
 border:1.5px solid rgba(255,255,255,.72);
 box-shadow:0 26px 50px rgba(58,26,124,.32)}
.arc video{width:100%;height:100%;object-fit:cover}
/* option 2 · crest: big logo centred at the top, centred title + meta + gradient CTA below */
.arc .crest{position:absolute;top:22px;left:14px;right:14px;display:flex;align-items:center;
 justify-content:center;gap:12px;height:133px;isolation:isolate;opacity:0;transition:opacity .35s var(--ease)}
.arc .crest::before{content:"";position:absolute;inset:-22px -14px -40px;z-index:-1;pointer-events:none;
 background:linear-gradient(to bottom, rgba(6,7,16,.5) 0%, rgba(6,7,16,0) 100%)}
.arc .crest img{max-height:133px;max-width:72%;width:auto;height:auto;display:block;
 filter:drop-shadow(0 8px 22px rgba(6,7,16,.55))}
.arc .crest.duo{gap:10px}
.arc .crest.duo img{max-height:110px;max-width:40%}
.arc .crest em{font-style:normal;font-weight:300;font-size:40px;line-height:1;color:#fff;
 opacity:.85;flex:none;filter:drop-shadow(0 6px 16px rgba(6,7,16,.55))}
.arc .copy{position:absolute;right:16px;left:16px;bottom:16px;text-align:center;
 opacity:0;transition:opacity .35s var(--ease)}
.arc .cell.mid .copy,.arc .cell.mid .crest{opacity:1}
.arc .event{font:var(--ds-h2);margin:0;color:#fff}
.arc .meta{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;
 font:var(--ds-body2);margin:8px 0 14px;color:#fff;opacity:.9}
.arc .meta i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
.arc .cta{height:44px}

/* ============ SECTION 3 · the question + four categories ============ */
.ask{padding:42px 14px 90px}
/* the sentence AND the four windows share one dark band. It runs edge to edge
   because the longest line is 359px and the type is not negotiable — an inset
   card would leave the words touching its corners. */
.ask__panel{margin-inline:-14px;padding:80px 10px 72px;border-radius:28px;
 background:
  radial-gradient(42% 9%  at 82%  3%, #FFDCF3 0%, rgba(255,220,243,0) 70%),
  radial-gradient(38% 8%  at 10%  9%, #D6ECFF 0%, rgba(214,236,255,0) 72%),
  radial-gradient(46% 8%  at 58% 17%, #EDE4FF 0%, rgba(237,228,255,0) 70%),
  radial-gradient(40% 9%  at  6% 26%, #FFE7CE 0%, rgba(255,231,206,0) 72%),
  radial-gradient(44% 8%  at 90% 33%, #FFD9F0 0%, rgba(255,217,240,0) 70%),
  radial-gradient(40% 9%  at 28% 41%, #D9EAFF 0%, rgba(217,234,255,0) 72%),
  radial-gradient(46% 8%  at 72% 50%, #F1E4FF 0%, rgba(241,228,255,0) 70%),
  radial-gradient(38% 9%  at 12% 59%, #FFE9D6 0%, rgba(255,233,214,0) 72%),
  radial-gradient(44% 8%  at 86% 67%, #E4E8FF 0%, rgba(228,232,255,0) 70%),
  radial-gradient(42% 9%  at 34% 76%, #FFDFF0 0%, rgba(255,223,240,0) 72%),
  radial-gradient(46% 9%  at 68% 85%, #E9F1FF 0%, rgba(233,241,255,0) 70%),
  radial-gradient(44% 10% at 18% 95%, #FFEEDC 0%, rgba(255,238,220,0) 72%),
  linear-gradient(180deg,var(--t-sky-1) 0%, var(--t-sky-2) 34%, var(--t-sky-3) 62%, var(--t-sky-4) 100%)}
/* the windows keep the 36px inset they had before the band wrapped them */
.ask__panel > .deck{padding:0 26px}
.ask__line{margin:0;text-align:center;font-size:min(54px,13.8vw);line-height:1.06;
 letter-spacing:0;
 color:var(--ink)}
/* the break points are authored, not wrapped */
.ask__line span{display:block;white-space:nowrap}
.perks__head .ln{display:block;white-space:nowrap}
.ask__line .w{display:inline-block;font-style:normal;will-change:opacity,transform;color:var(--ink)}
.ask__line .t{font-weight:300}
.ask__line .b{font-weight:700}
/* the ramp is painted into the glyphs; each word gets its own slice of one
   block-wide gradient, so the two lines read as a single sweep */
.ask__line .b .w{
 padding:.2em 0;margin:-.2em 0;
 background-image:linear-gradient(104deg,var(--c-blue) 0%, #E0409F 52%, var(--c-purple) 100%);
 background-repeat:no-repeat;
 -webkit-background-clip:text;background-clip:text;color:transparent}

.deck{display:flex;flex-direction:column;gap:24px;margin-top:48px;padding:0 22px}
.tile{position:relative;will-change:transform,opacity;
 opacity:0;transform:var(--from,none);
 transition:opacity 1.25s var(--ease) var(--d,0s), transform 1.5s var(--ease) var(--d,0s)}
.tile.in{opacity:1;transform:var(--to,none)}
@media (prefers-reduced-motion: reduce){ .tile{opacity:1;transform:none;transition:none} }
.tile__v{position:relative;aspect-ratio:16/7.8;border-radius:20px;overflow:hidden;
 background:#11121C;border:1.5px solid rgba(6,7,15,.72);
 box-shadow:0 14px 26px rgba(58,26,124,.24)}

/* ============ THE EXPERIENCE · full-frame, reel style ============ */
body.reel-open{overflow:hidden}
.reel{position:fixed;inset:0;z-index:1000;background:#06070F;
 opacity:0;visibility:hidden;transition:opacity .4s var(--ease), visibility .4s var(--ease)}
.reel.open{opacity:1;visibility:visible}
.reel__track{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;
 scroll-snap-type:x mandatory;scrollbar-width:none}
.reel__track::-webkit-scrollbar{display:none}
.reel__slide{position:relative;flex:none;width:100%;height:100%;scroll-snap-align:center;
 overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.reel__slide::-webkit-scrollbar{display:none}
/* the footage stays put while the sheet climbs over it */
.reel__stage{position:sticky;top:0;height:100%;z-index:1}

/* the dark sheet: its own top edge is the fade the video shows through; it stops
   short of black so the footage keeps running dimly behind the glass panel */
.reel__veil{position:absolute;inset:0;z-index:3;pointer-events:none;
 background:linear-gradient(to bottom,
   rgba(6,7,16,0) 0%, rgba(6,7,16,0) 59%, rgba(6,7,16,.4) 64%,
   rgba(6,7,16,.66) 70%, rgba(6,7,16,.74) 77%, rgba(6,7,16,.74) 100%);
 background-size:100% 200%;background-repeat:no-repeat;background-position:0 0}
.reel__detail{position:relative;z-index:4;padding:26vh 22px 182px;color:#fff;background:none;
 pointer-events:none}
.rd__kicker{margin:0;font:var(--ds-body2);opacity:.55;text-align:center}
/* place · date — only the desktop split shows it; the footage carries it on mobile */
.rd__meta{display:none;margin:12px 0 0;align-items:center;gap:10px;font:400 18px/1 var(--fa-font);opacity:.7}
.rd__meta i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;flex:none}
.rd__title{margin:0;font-weight:700;font-size:40px;line-height:1.05;
 letter-spacing:-.02em;text-align:center}
.rd__about{margin:14px auto 0;max-width:42ch;font:var(--ds-body3);opacity:.85;text-align:center}
/* the facts: one frosted panel, the lobby perk bar's glass — information only, nothing to pick */
.rd__glass{margin-top:26px;border-radius:24px;padding:24px 20px 22px;text-align:center;
 background:rgba(120,124,150,.34);border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.rd__lbl{margin:0;font:var(--ds-body1-bold);font-size:13px;opacity:.7}
.rd__dates{margin:10px 0 0;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
 font:700 17px/1.3 var(--fa-font)}
.rd__dates i{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.6;flex:none}
.rd__rule{height:1px;background:rgba(255,255,255,.22);margin:20px 0}
.rd__tiers{display:flex;justify-content:center;gap:6px;margin-top:10px}
.rd__tiers span{height:30px;padding:0 14px;border-radius:15px;display:grid;place-items:center;
 font:700 14px/1 var(--fa-font);background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22)}
.rd__price{margin:18px 0 0}
.rd__price b{display:block;font:700 24px/1.1 var(--fa-font)}
.rd__price span{display:block;margin-top:7px;font:var(--ds-body2);opacity:.72}
/* rides at the foot of the slide above the details sheet, chevron under the CTA */
.reel__act{position:sticky;bottom:0;z-index:5;margin-top:-168px;height:168px;box-sizing:border-box;padding:16px 22px 0;
 opacity:0;transform:translateY(14px);pointer-events:none;
 background:linear-gradient(to top,#06070F 42%,rgba(6,7,16,0) 100%);
 transition:opacity .35s var(--ease), transform .45s var(--ease)}
.reel__act.show,.reel__slide.live .reel__act{opacity:1;transform:none;pointer-events:auto}
.rd__cta{width:100%;
 box-shadow:0 14px 34px rgba(130,74,234,.5);
 transition:transform .18s var(--ease)}
.rd__cta:active{transform:scale(.97)}
/* the second way in: buy it outright — in money, or with points already in the account */
.rd__buy{width:100%;margin-top:10px;font-family:var(--fa-font);color:#fff;
 background:rgba(120,124,150,.34);border:1px solid rgba(255,255,255,.22);

/* ---- "you already have enough" — only when the account covers a package ----
   the "enough points" switch turns it on with <html data-points="enough"> */
html:not([data-points="enough"]) .rd__have{display:none}
@property --have-a{syntax:'<angle>';initial-value:0deg;inherits:false}
[data-points="enough"] .reel__detail{padding-bottom:256px}
[data-points="enough"] .reel__act{margin-top:-242px;height:242px}
[data-points="enough"] .reel__copy{bottom:248px}
.rd__have{position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;text-align:right;
 margin-bottom:10px;padding:10px 10px 10px 14px;border-radius:18px;color:#fff;
 background:rgba(120,124,150,.34);
 backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
/* the frame: the brand gradient running round the edge */
.rd__have::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
 background:conic-gradient(from var(--have-a),#1B5ECE,#824AEA,#F63DE4,#FFFFFF 8%,#F63DE4 16%,#824AEA,#1B5ECE);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
 -webkit-mask-composite:xor;mask-composite:exclude;
 animation:haveSpin 3.2s linear infinite}
/* the same gradient, blurred, breathing behind it */
.rd__have::after{content:"";position:absolute;inset:-2px;z-index:-1;border-radius:inherit;pointer-events:none;
 background:conic-gradient(from var(--have-a),#1B5ECE,#824AEA,#F63DE4,#824AEA,#1B5ECE);
 filter:blur(14px);opacity:.45;animation:haveSpin 3.2s linear infinite, haveGlow 2.4s ease-in-out infinite}
/* and a glint that crosses the glass now and then */
.rd__have__glint{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.rd__have__glint::before{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;
 background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.28),rgba(255,255,255,0));
 animation:haveGlint 3.6s var(--ease) infinite}
@keyframes haveSpin{to{--have-a:360deg}}
@keyframes haveGlow{0%,100%{opacity:.3}50%{opacity:.62}}
@keyframes haveGlint{0%,55%{left:-60%}100%{left:130%}}
.rd__have__ic{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
 background:var(--ds-gradient);box-shadow:0 6px 16px rgba(130,74,234,.5)}
.rd__have__ic svg{width:18px;height:13px;fill:#fff}
.rd__have__tx{flex:1;min-width:0}
.rd__have__tx b{display:block;font:700 15px/1.15 var(--fa-font)}
.rd__have__tx span{display:block;margin-top:3px;font:var(--ds-body1);opacity:.78}
.rd__have__go{flex:none;height:34px;padding:0 16px;border-radius:17px;background:#fff;color:var(--ds-blue);
 font:700 14px/34px var(--fa-font);white-space:nowrap;transition:transform .18s var(--ease)}
.rd__have__go:active{transform:scale(.95)}
@media (prefers-reduced-motion: reduce){
  .rd__have::before,.rd__have::after,.rd__have__glint::before{animation:none}
}
/* mobile: a taller banner, and the sheet under it makes the same extra room */
@media (max-width:1023px){
  .rd__have{min-height:108px;box-sizing:border-box;padding:20px 14px 20px 18px;gap:14px}
  .rd__have__ic{width:42px;height:42px}
  .rd__have__ic svg{width:22px;height:16px}
  .rd__have__tx b{font-size:17px}
  .rd__have__tx span{margin-top:5px;font-size:13px}
  .rd__have__go{height:40px;padding:0 20px;font-size:15px;line-height:40px;border-radius:20px}
  [data-points="enough"] .reel__detail{padding-bottom:300px}
  [data-points="enough"] .reel__act{margin-top:-286px;height:286px}
  [data-points="enough"] .reel__copy{bottom:292px}
}
.reel__hint{transition:opacity .3s var(--ease)}
.reel__v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* one segment per experience — the same set the carousel holds */
.reel__bars{position:absolute;top:14px;left:14px;right:14px;z-index:3;display:flex;gap:4px}
.reel__bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);
 transition:background .3s var(--ease)}
.reel__bars i.on{background:#fff}

/* the card's own layout, carried onto the full frame:
   logo centred at the top, title + meta centred at the foot, CTA under them */
.reel__crest{position:absolute;top:92px;left:20px;right:20px;z-index:2;height:146px;
 display:flex;align-items:center;justify-content:center;gap:12px;isolation:isolate;
 transform-origin:50% 0;transform:scale(.7);opacity:0;
 transition:transform .8s var(--ease), opacity .5s var(--ease)}
.reel__crest::before{content:"";position:absolute;inset:-92px -20px -56px;z-index:-1;pointer-events:none;
 background:linear-gradient(to bottom, rgba(6,7,16,.55) 0%, rgba(6,7,16,0) 100%)}
.reel__crest img{max-height:146px;max-width:70%;width:auto;height:auto;display:block;
 filter:drop-shadow(0 8px 22px rgba(6,7,16,.55))}
.reel__crest.duo{gap:10px}
.reel__crest.duo img{max-height:118px;max-width:40%}
.reel__crest em{font-style:normal;font-weight:300;font-size:46px;line-height:1;color:#fff;
 opacity:.85;flex:none;filter:drop-shadow(0 6px 16px rgba(6,7,16,.55))}
.reel__copy{position:absolute;right:20px;left:20px;bottom:174px;z-index:2;text-align:center;color:#fff;
 transform-origin:50% 100%;transform:scale(.7);opacity:0;
 transition:transform .8s var(--ease), opacity .5s var(--ease)}
.reel__slide.live .reel__copy,.reel__slide.live .reel__crest{transform:none;opacity:1}
@media (prefers-reduced-motion: reduce){ .reel__copy,.reel__crest{transform:none;opacity:1;transition:none} }
.reel__copy .event{font:700 28px/1.1 var(--fa-font);margin:0}
.reel__copy .meta{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;
 font:400 16px/1.2 var(--fa-font);margin:8px 0 0;opacity:.9}
.reel__copy .meta i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
/* the dark rise at the foot of the frame */
.reel__foot{position:absolute;left:0;right:0;bottom:0;height:42%;pointer-events:none;
 background:linear-gradient(to top,rgba(6,7,16,.94) 0%,rgba(6,7,16,.72) 28%,
   rgba(6,7,16,.34) 58%,rgba(6,7,16,0) 100%)}
/* the scroll hint: a sheet handle over the title that tugs upward — "there's a page to pull up" */
.reel__hint{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:16px;
 color:#fff;pointer-events:none}
.reel__hint i{display:block;width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.85);
 animation:hintTug 1.8s cubic-bezier(.3,.7,.3,1) infinite}
.reel__hint span{font:400 13px/1 var(--fa-font);letter-spacing:.02em;
 animation:hintTugLbl 1.8s cubic-bezier(.3,.7,.3,1) infinite}
@keyframes hintTug{
  0%,100%{transform:translateY(0);width:44px}
  35%{transform:translateY(-10px);width:32px}
}
@keyframes hintTugLbl{0%,100%{opacity:.45}35%{opacity:.9}}
.reel__close{position:absolute;top:32px;right:16px;z-index:6;width:44px;height:44px;border-radius:50%;
 display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);
 border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 transition:transform .2s var(--ease)}
.reel__close:active{transform:scale(.92)}
@media (prefers-reduced-motion: reduce){ .reel__hint i,.reel__hint span{animation:none} }

/* ============ HOW IT WORKS · the three-step walkthrough ============ */
/* The veil grows: only a strip at the very top stays clear, so the footage
   keeps running behind the headline of the screen and everything else is flat
   black for the walkthrough to sit on. */
.how{position:absolute;inset:0;z-index:20;opacity:0;visibility:hidden;
 transition:opacity .45s var(--ease), visibility .45s var(--ease)}
.reel.how-open .how{opacity:1;visibility:visible}
.how__veil{position:absolute;inset:0;z-index:1;pointer-events:none;
 background:linear-gradient(to bottom,
   rgba(6,7,15,0) 0%, rgba(6,7,15,.14) 7%, rgba(6,7,15,.72) 16%,
   #06070F 24%, #06070F 100%)}
/* while the walkthrough is up the reel's own furniture steps aside */
.reel.how-open .reel__veil,
.reel.how-open .reel__detail,
.reel.how-open .reel__act,
.reel.how-open .reel__copy,
.reel.how-open .reel__crest,
.reel.how-open .reel__hint,
.reel.how-open .reel__foot,
.reel.how-open .reel__bars,
.reel.how-open .reel__close{opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.reel.how-open .reel__slide{overflow:hidden}
.reel.how-open .reel__track{overflow:hidden}

.how__track{position:absolute;left:0;right:0;top:25%;bottom:0;z-index:2;
 display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
 scrollbar-width:none;overscroll-behavior:contain}
.how__track::-webkit-scrollbar{display:none}
.how__step{flex:none;width:100%;height:100%;scroll-snap-align:center;
 display:flex;flex-direction:column;align-items:center;padding:6px 24px 92px}

.how__art{flex:none;display:flex;justify-content:center;width:100%}
.how__art svg{width:100%;max-width:268px;height:auto;max-height:27vh;
 fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* auto margin, so the copy is pinned to the bottom whatever the art's height */
.how__copy{margin-top:auto;text-align:center;color:#fff;padding-top:18px;width:100%}
.how__copy h3{margin:0 0 10px;font:var(--ds-h1);color:var(--tone-fg)}
.how__copy p{margin:0 0 5px;font:var(--ds-body3);opacity:.82}

/* the highlighted line each step ends on */
.how__note{margin-top:16px;border-radius:16px;padding:13px 16px;
 background:var(--tone-bg);border:1px solid var(--tone-br)}
.how__note b{display:block;font:var(--ds-body4-bold);color:var(--tone-fg)}
.how__note span{display:block;margin-top:3px;font:var(--ds-body2);opacity:.78}

.how__cta{width:100%;margin-top:16px;
 box-shadow:0 12px 30px rgba(130,74,234,.42);
 transition:transform .18s var(--ease)}
.how__cta:active{transform:scale(.97)}

/* one accent per step — lifted off the brand ramp, but opened up enough to
   hold its own on black */
.tone-blue   {--tone-fg:#6BA6FF;--tone-bg:rgba(77,141,245,.13);--tone-br:rgba(77,141,245,.3)}
.tone-purple {--tone-fg:#B48BFF;--tone-bg:rgba(138,75,243,.15);--tone-br:rgba(138,75,243,.34)}
.tone-magenta{--tone-fg:#FF84EE;--tone-bg:rgba(252,61,224,.13);--tone-br:rgba(252,61,224,.3)}

.how__dots{position:absolute;left:0;right:0;bottom:44px;z-index:3;
 display:flex;justify-content:center;gap:8px;pointer-events:none}
.how__dots i{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.28);
 transition:width .35s var(--ease), background .35s var(--ease)}
.how__dots i.on{width:26px;background:#fff}
.how__close{position:absolute;top:32px;right:16px;z-index:4;width:44px;height:44px;
 border-radius:50%;display:grid;place-items:center;color:#fff;
 background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 transition:transform .2s var(--ease)}
.how__close:active{transform:scale(.92)}

/* ---- step 1 · the hand picking one of four ---- */
.hand{animation:handPick 5s var(--ease) infinite alternate}
@keyframes handPick{
  0%      {transform:translate(147px,42px)}
  6%,13%  {transform:translate(147px,32px)}
  20%     {transform:translate(147px,42px)}
  27%     {transform:translate(39px,42px)}
  31%,38% {transform:translate(39px,32px)}
  45%     {transform:translate(39px,42px)}
  52%     {transform:translate(39px,150px)}
  56%,63% {transform:translate(39px,140px)}
  70%     {transform:translate(39px,150px)}
  77%     {transform:translate(147px,150px)}
  81%,88% {transform:translate(147px,140px)}
  95%,100%{transform:translate(147px,150px)}
}
.pick{fill:rgba(255,255,255,.16);stroke:none;opacity:0;
 animation:none 5s linear infinite alternate}
.pickA{animation-name:pickA} .pickB{animation-name:pickB}
.pickC{animation-name:pickC} .pickD{animation-name:pickD}
@keyframes pickA{0%,4%{opacity:0}  7%,19%{opacity:1} 22%,100%{opacity:0}}
@keyframes pickB{0%,29%{opacity:0} 32%,44%{opacity:1} 47%,100%{opacity:0}}
@keyframes pickC{0%,54%{opacity:0} 57%,69%{opacity:1} 72%,100%{opacity:0}}
@keyframes pickD{0%,79%{opacity:0} 82%,94%{opacity:1} 97%,100%{opacity:0}}

/* ---- step 2 · the approval drawing itself on the card ---- */
.ok__ring{stroke-dasharray:189;stroke-dashoffset:189}
.ok__tick{stroke-dasharray:50;stroke-dashoffset:50}
.how__step.play .ok__ring,.hacc.play .ok__ring{animation:drawRing 1s var(--ease) .3s forwards}
.how__step.play .ok__tick,.hacc.play .ok__tick{animation:drawTick .42s var(--ease) 1.15s forwards}
@keyframes drawRing{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}

/* ---- step 3 · the clouds going past the window ---- */
.cloud{animation:drift linear infinite}
.cloud--a{animation-duration:9s;animation-delay:-1s}
.cloud--b{animation-duration:13s;animation-delay:-6s}
.cloud--c{animation-duration:11s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(210px)}to{transform:translateX(-130px)}}
/* filled in the backdrop's own colour, and painted after the clouds, so the
   weather passes behind it instead of showing through */
.wing,.handfill{fill:#06070F}
.handfill{stroke:none}

@media (prefers-reduced-motion: reduce){
  .hand,.pick,.cloud{animation:none}
  .ok__ring,.ok__tick{stroke-dashoffset:0}
}

/* ============ SECTION 4 · what else the points buy ============ */
/* A real site section: eyebrow → headline → sub → carousel with controls → CTA.
   Set entirely in Ploni (the DS text tokens resolve to Almoni at :root). */
.perks{--pf:'Ploni',system-ui,sans-serif;padding:56px 0 72px;color:var(--ds-black);font-family:var(--pf)}
.perks__head{padding:0 22px;text-align:right}
.perks__eyebrow{display:inline-flex;align-items:center;gap:7px;margin:0 0 12px;
 font:600 14px/1 var(--pf);color:var(--ds-blue)}
.perks__eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ds-blue)}
.perks__head h2{margin:0;font:300 min(54px,13.8vw)/1.06 var(--pf);letter-spacing:0;color:var(--ds-black)}
.perks__head h2 b{font-weight:700;padding:.1em 0;
 background-image:var(--ds-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.perks__head .perks__sub{white-space:normal}
.perks__sub{margin:12px 0 0;max-width:330px;font:400 16px/1.4 var(--pf);color:#5B6170}

.perks__rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
 scroll-behavior:smooth;scrollbar-width:none;margin-top:24px;padding:0 22px;
 scroll-padding:0 22px}
.perks__rail::-webkit-scrollbar{display:none}
.perk{flex:none;width:74%;aspect-ratio:4/5;scroll-snap-align:start;position:relative;
 border-radius:20px;overflow:hidden;background:#11121C;color:#fff;
 box-shadow:0 14px 30px rgba(4,15,33,.16)}
.perk video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.perk__wash{position:absolute;inset:0;pointer-events:none;
 background:linear-gradient(to top, rgba(4,8,20,.45) 0%, transparent 40%)}
/* the copy sits in a frosted bar inset along the bottom edge: title, points
   under it, and a solid white round button on the end side */
.perk__bar{position:absolute;right:10px;left:10px;bottom:10px;
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:14px 16px 14px 12px;border-radius:16px;
 background:rgba(120,124,150,.34);border:1px solid rgba(255,255,255,.22);
 backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
.perk__copy{text-align:right;min-width:0}
.perk__copy b{display:block;font:700 20px/1.1 var(--pf)}
.perk__copy span{display:block;margin-top:4px;font:400 13px/1.2 var(--pf);opacity:.85}
.perk__go{flex:none;width:40px;height:40px;border-radius:50%;
 display:grid;place-items:center;background:#fff;color:var(--ds-black);
 transition:transform .2s var(--ease)}
.perk__go:active{transform:scale(.92)}

/* dots on the start side, small round arrows on the end side */
.perks__ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:18px;padding:0 22px}
.perks__dots{display:flex;gap:6px}
.perks__dots i{width:7px;height:7px;border-radius:999px;background:#D5D8DE;
 transition:width .35s var(--ease), background .35s var(--ease)}
.perks__dots i.on{width:22px;background:var(--ds-black)}
.perks__nav{display:flex;gap:8px}
.perks__nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
 background:#fff;border:1px solid #E1E3E8;color:var(--ds-black);padding:0;
 transition:opacity .25s var(--ease), transform .2s var(--ease)}
.perks__nav button:active{transform:scale(.94)}
.perks__nav button:disabled{opacity:.35}
.perks__cta{margin:26px 22px 0;width:calc(100% - 44px);font-family:var(--pf);
 box-shadow:0 12px 28px rgba(130,74,234,.28)}

/* ============ SECTION 5 · footer ============ */
/* Figma: FlyAll – New Design / Footer, Property 1=Mobile (390 wide). Every text
   box is trimmed to cap height there, so the row paddings below are the gaps
   between the letters themselves. */
.foot{--pf:'Ploni',system-ui,sans-serif;background:#F4F7FD;padding:40px 16px;
 display:flex;flex-direction:column;gap:40px;color:var(--ink);font-family:var(--pf)}
.foot a{text-decoration:none;color:inherit}
.foot__groups{display:flex;flex-direction:column;gap:32px}
.foot__group{display:flex;flex-direction:column;text-align:right}
.foot__group h4,.foot__group > a,.foot__note,.foot__legal{text-box:trim-both cap alphabetic}
.foot__group h4{margin:0;padding:16px 20px;font:600 18px/normal var(--pf)}
.foot__group > a{display:block;padding:12px 20px;font:400 18px/normal var(--pf)}
.foot__note{margin:0;padding:2px 20px;font:400 14px/18px var(--pf);color:#363636}
.foot__note span{display:block;width:227px}
.foot__social{display:flex;gap:16px;padding:12px 20px}
.foot__social a{flex:none;transition:transform .2s var(--ease)}
.foot__social a:active{transform:scale(.92)}
.foot__social img{display:block;width:40px;height:40px}
.foot__rule{display:block;width:100%;height:1px}
.foot__legal{margin:0 auto;width:338px;max-width:100%;text-align:center;
 font:400 16px/16px var(--pf)}

/* ---------- entry animation: time-based, fired on arrival ----------
   Everything that should float in starts here and is released by an
   IntersectionObserver when its section actually reaches the screen. */
.en{opacity:0;transform:translateY(30px);
 transition:opacity .72s var(--ease) var(--d,0s), transform .9s var(--ease) var(--d,0s)}
.en.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ .en{opacity:1;transform:none;transition:none} }

/* ---------- staged reveal of the page underneath ---------- */
.rv{opacity:0;transform:translateY(24px);
 transition:opacity .75s var(--ease), transform .85s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion: reduce){ .rv{opacity:1;transform:none} }

/* ============ CATEGORY PAGE · option B — arc of picks + the full list ============ */
.arc .lead{position:relative}
/* the title keeps the lobby's type and placement (72px Ploni, centred, 88px down);
   only the picks shrink, so the list still lands close under them */
.arc h2 b{font-weight:700}
.arc .lead__sub{display:flex;align-items:center;justify-content:center;gap:8px}
/* a small way home: it takes the title's old place, 88px under the bar, and the title follows it */
.lead__home{margin-bottom:20px;
 display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px 0 12px;border-radius:999px;
 font:600 14px/1 var(--pf);color:var(--ds-blue);text-decoration:none;white-space:nowrap;
 background:rgba(255,255,255,.75);border:1px solid #E6E1F2;box-shadow:0 4px 12px rgba(58,26,124,.08);
 transition:background .2s var(--ease)}
.lead__home:hover{background:#fff}
.lead__home:active{transform:scale(.96)}
.lead__home svg{flex:none}
.arc .lead__sub b{font-weight:700;color:var(--ink)}
.arc .lead__sub i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
.arc .track{padding:26px calc(50% - 31.5vw) 48px;
 -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent);
 mask-image:linear-gradient(to bottom,#000 calc(100% - 30px),transparent)}
.arc .cell{width:63vw;aspect-ratio:9/13;border-radius:22px;box-shadow:0 20px 40px rgba(58,26,124,.3)}
.arc .crest{top:16px;left:12px;right:12px;height:92px;gap:8px}
.arc .crest::before{inset:-16px -12px -32px}
.arc .crest img{max-height:92px;max-width:70%}
.arc .crest.duo img{max-height:74px;max-width:40%}
.arc .crest em{font-size:30px}
.arc .copy{right:14px;left:14px;bottom:16px}
.arc .event{font:700 22px/1.1 var(--fa-font)}
.arc .meta{font:400 14px/1.2 var(--fa-font);gap:8px;margin:7px 0 0}

/* the list sits on its own band — the same sky panel the lobby's four windows
   are set on (.ask__panel), edge to edge with rounded corners */
.list{--pf:'Ploni',system-ui,sans-serif;font-family:var(--pf);color:var(--ink);
 margin:44px 0 0;padding:36px 0 56px;border-radius:28px;
 overflow-x:clip}                 /* the windows fly in from past the edges */
.list{scroll-margin-top:72px}
.list__head{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px}
.list__head h3{margin:0;font:700 28px/1.1 var(--pf)}
.list__head h3 span{font-weight:300;color:var(--ds-gray);margin-inline-start:6px}
.list__sort{display:inline-flex;align-items:center;gap:5px;font:600 15px/1 var(--pf);color:var(--ds-blue)}
/* ---- the search pill: three category-specific facets and a round gradient go ---- */
.seek{margin:24px 20px 0;height:62px;display:flex;align-items:center;padding:6px;
 background:#fff;border-radius:999px;border:1px solid rgba(4,15,33,.06);
 box-shadow:0 12px 28px rgba(58,26,124,.14)}
.seek__seg{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;
 align-items:flex-start;padding:0 14px;border-radius:999px;text-align:right;transition:background .2s var(--ease)}
.seek__seg:hover{background:var(--ds-light-blue-1)}
.seek__seg + .seek__seg::before{content:"";position:absolute;right:0;top:13px;bottom:13px;width:1px;background:#ECEDF1}
.seek__seg small{font:500 12px/1 var(--pf);color:var(--ds-gray)}
.seek__seg b{margin-top:5px;max-width:100%;font:700 15px/1.15 var(--pf);color:var(--ink);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seek__seg.is-set b{color:var(--ds-purple)}
.seek__go{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;
 background-image:var(--ds-gradient);box-shadow:0 8px 18px rgba(130,74,234,.4);transition:transform .2s var(--ease)}
.seek__go:active{transform:scale(.92)}

/* ---- the sheet it opens: the same three steps as tabs, a question, visual choices ---- */
body.sheet-open{overflow:hidden}
.sheet{position:fixed;inset:0;z-index:500;visibility:hidden;pointer-events:none;
 font-family:var(--fa-font);color:var(--ink);transition:visibility 0s linear .7s}
.sheet.open{visibility:visible;pointer-events:auto;transition:none}
.sheet__dim{position:absolute;inset:0;background:rgba(6,7,16,.5);opacity:0;transition:opacity .6s linear}
.sheet.open .sheet__dim{opacity:1}
.sheet__panel{position:absolute;left:0;right:0;bottom:0;max-height:88svh;display:flex;flex-direction:column;
 padding:10px 0 calc(16px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;
 background:linear-gradient(180deg,var(--t-sky-1) 0,#fff 150px);
 box-shadow:0 -12px 40px rgba(6,7,16,.18);
 transform:translateY(104%);transition:transform .7s cubic-bezier(.4,0,.2,1)}
.sheet.open .sheet__panel{transform:none}
/* the grey line is the handle: drag it down to let the sheet go */
.sheet__handle{margin:-10px 0 4px;padding:12px 0 14px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.sheet__handle:active{cursor:grabbing}
.sheet__grip{display:block;width:40px;height:4px;border-radius:2px;background:#D5D8DE;margin:0 auto;
 transition:width .25s var(--ease), background .25s var(--ease)}
.sheet.drag .sheet__grip{width:52px;background:#B9BDC6}
.sheet__tabs{display:flex;gap:6px;padding:0 16px}
.sheet__tab{flex:1;min-width:0;padding:9px 12px;border-radius:14px;text-align:right;
 background:rgba(255,255,255,.7);border:1.5px solid #E6E1F2;transition:border-color .4s var(--glide)}
.sheet__tab b{transition:color .35s var(--glide)}
.sheet__tab small{display:block;font:500 12px/1 var(--fa-font);color:var(--ds-gray)}
.sheet__tab b{display:block;margin-top:4px;font:700 14px/1.15 var(--fa-font);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet__tab.is-set b{color:var(--ds-purple)}
.sheet__tab.is-on{border-color:transparent;
 background:linear-gradient(#fff,#fff) padding-box, var(--ds-gradient) border-box}
.sheet{--glide:cubic-bezier(.4,0,.2,1)}
.sheet__body{padding:12px 20px 18px;overflow-x:hidden;overflow-y:auto;
 transition:height .5s var(--glide)}
/* moving between steps: the old step slides a little and fades one way,
   the new one comes in from the other, and the sheet eases to its new height */
.sheet__stage{transition:opacity .26s linear, transform .38s var(--glide)}
.sheet__stage.out{opacity:0;transform:translateX(calc(var(--dir, 1) * 28px))}
.sheet__stage.pre{opacity:0;transform:translateX(calc(var(--dir, 1) * -28px));transition:none}
.sheet__q{margin:0 0 16px;font:700 26px/1.1 var(--fa-font)}
.sheet__opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
/* each choice is a still of its own footage, with the name — or the logo — on it */
.sheet__opt{position:relative;aspect-ratio:1/1.08;border-radius:16px;overflow:hidden;isolation:isolate;
 display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:10px 6px;
 color:#fff;text-align:center;background:#11121C center/cover no-repeat;
 transition:transform .3s var(--glide), box-shadow .35s var(--glide)}
.sheet__opt::before{content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(to top, rgba(6,7,16,.82) 0%, rgba(6,7,16,.35) 60%, rgba(6,7,16,.2) 100%)}
.sheet__opt img{position:absolute;top:18%;left:50%;transform:translateX(-50%);max-height:34%;max-width:62%;
 filter:drop-shadow(0 4px 10px rgba(6,7,16,.5))}
.sheet__opt b{font:700 15px/1.1 var(--fa-font)}
.sheet__opt small{font:400 12px/1 var(--fa-font);opacity:.8}
.sheet__opt--all{background-image:var(--ds-gradient)}
.sheet__opt--all::before{background:none}
.sheet__opt--all b{font-size:18px}
.sheet__opt.is-on{box-shadow:0 0 0 2.5px #fff, 0 0 0 5px var(--ds-purple)}
.sheet__opt:active{transform:scale(.96)}
.sheet__opts--when{grid-template-columns:repeat(4,minmax(0,1fr))}
.sheet__opts--when .sheet__opt{aspect-ratio:auto;height:66px;justify-content:center;color:var(--ink);
 background:#fff;border:1.5px solid #E6E1F2}
.sheet__opts--when .sheet__opt::before{display:none}
.sheet__opts--when .sheet__opt small{opacity:1;color:var(--ds-gray)}
.sheet__opts--when .sheet__opt{transition:border-color .35s var(--glide), background-color .35s var(--glide), box-shadow .35s var(--glide)}
.sheet__opts--when .sheet__opt.is-on{border-color:var(--ds-purple);background:#F7F2FF;box-shadow:none}
.sheet__opts--when .sheet__opt--all{background:var(--ds-gradient);border-color:transparent;color:#fff}
.sheet__opts--when .sheet__opt--all small{color:#fff;opacity:.85}
.sheet__opts--when .sheet__opt--all.is-on{box-shadow:0 0 0 2.5px #fff, 0 0 0 5px var(--ds-purple)}
.sheet__foot{display:flex;padding:14px 20px 0;border-top:1px solid #F0EEF5}
.sheet__x{display:none}
.sheet__clear{display:inline-flex;align-self:flex-start;margin:10px 20px 0;padding:6px 0;font:600 15px/1 var(--fa-font);color:var(--ds-blue);
 text-decoration:underline;text-underline-offset:3px;transition:opacity .3s linear}
.sheet__clear[hidden]{display:inline-flex;opacity:0;pointer-events:none}
.sheet__cta{flex:1;height:52px;border-radius:26px;font-family:var(--fa-font)}
@media (prefers-reduced-motion: reduce){ .sheet__panel,.sheet__body,.sheet__stage{transition:none!important} }
.list__rows{padding:48px 20px 0;transition:padding-top .45s cubic-bezier(.4,0,.2,1)}
/* "ניקוי הבחירה" under the search pill, only while a search is applied — it opens its
   own room, and the gap to the list gives back the same amount so the list barely moves */
.seek__reset{display:grid;grid-template-rows:0fr;margin:0 20px;opacity:0;
 transition:grid-template-rows .45s cubic-bezier(.4,0,.2,1), margin-top .45s cubic-bezier(.4,0,.2,1), opacity .3s linear}
.seek__reset > div{overflow:hidden;display:flex}
.seek__reset button{padding:4px 2px;font:600 15px/1 var(--pf);color:var(--ds-blue);
 text-decoration:underline;text-underline-offset:3px}
.list.has-sel .seek__reset{grid-template-rows:1fr;margin-top:16px;opacity:1}
.list.has-sel .list__rows{padding-top:30px}

/* option 5 · the cinematic strip: every experience is a wide, low band of its own
   footage with the title on it, and one quiet line of facts plus a points pill under it */
.row{position:relative;cursor:pointer}
.row + .row{margin-top:32px}      /* matches the visible gap from the "כל החוויות" letters to the search pill */
.row__v{position:relative;aspect-ratio:21/9;border-radius:18px;overflow:hidden;isolation:isolate;
 background:#11121C;border:1.5px solid rgba(6,7,15,.72);
 box-shadow:0 14px 26px rgba(58,26,124,.22);
 opacity:0;transform:translateY(34px) scale(.95);
 transition:opacity .8s var(--ease) var(--d,0s), transform 1s var(--ease) var(--d,0s),
   box-shadow .45s var(--ease)}
.row.in .row__v{opacity:1;transform:none}
.row.on .row__v{box-shadow:0 18px 34px rgba(130,74,234,.34)}
/* the footage settles in from a slight push, like a camera coming to rest */
.row__v video{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;
 transform:scale(1.18);transition:transform 1.8s var(--ease) var(--d,0s)}
.row.in .row__v video{transform:scale(1)}
.row__v::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
 background:linear-gradient(to top, rgba(6,7,16,.74) 0%, rgba(6,7,16,.12) 58%, rgba(6,7,16,.3) 100%)}
.row__kicker{position:absolute;top:12px;right:12px;height:26px;padding:0 10px;border-radius:999px;
 display:flex;align-items:center;font:600 12px/1 var(--pf);color:#fff;
 background:rgba(6,7,16,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.row h4{position:absolute;right:14px;left:56px;bottom:11px;margin:0;
 font:700 24px/1.05 var(--pf);color:#fff;text-shadow:0 2px 14px rgba(6,7,16,.5)}
.row__play{position:absolute;bottom:12px;left:12px;width:30px;height:30px;border-radius:50%;
 display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.2);
 border:1px solid rgba(255,255,255,.32);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
 transition:opacity .3s var(--ease), transform .3s var(--ease)}
.row.on .row__play{opacity:0;transform:scale(.8)}
/* the copy on the band and the line under it arrive a beat after the band */
.row__kicker,.row h4,.row__info{opacity:0;transform:translateY(12px);
 transition:opacity .6s var(--ease) calc(var(--d,0s) + var(--k)), transform .8s var(--ease) calc(var(--d,0s) + var(--k))}
.row__kicker{--k:.3s} .row h4{--k:.4s} .row__info{--k:.55s}
.row.in .row__kicker,.row.in h4,.row.in .row__info{opacity:1;transform:none}

.row__info{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 4px 0}
.row__meta{margin:0;min-width:0;font:400 14px/1.3 var(--pf);color:var(--ds-gray);
 display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.row__meta i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex:none}
.row__pill{flex:none;height:32px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;
 font:400 14px/1 var(--pf);color:var(--ink);white-space:nowrap;
 border:1.5px solid transparent;background:linear-gradient(#fff,#fff) padding-box, var(--ds-gradient) border-box;
 transition:transform .2s var(--ease)}
.row__pill b{font-weight:700;font-size:16px;padding:.1em 0;
 background-image:var(--ds-gradient);-webkit-background-clip:text;background-clip:text;color:transparent}
.row:active .row__pill{transform:scale(.96)}
@media (hover: hover){
  .row.in.open .row__v{transform:translateY(-3px);box-shadow:0 22px 40px rgba(130,74,234,.36)}
  .row.in.open .row__v video{transform:scale(1.05)}
}
.list__empty{padding:32px 0;text-align:center;color:var(--ds-gray);font:400 16px/1.4 var(--pf)}
.list__more{margin:24px 20px 0;width:calc(100% - 40px);font-family:var(--pf)}
@media (prefers-reduced-motion: reduce){
  .row__v,.row__v video,.row__kicker,.row h4,.row__info{transition:none!important;opacity:1!important;transform:none!important}
}


/* ============================================================
   RESPONSIVE — header only for now, same lines as the lobby (pov-reels.html):
   below 1024px the mobile header, 1024px and up the design system's desktop bar
   ============================================================ */
.fa-dh{display:none}
@media (min-width:600px) and (max-width:1023px){
  :root{ --fa-notch-w:132px; }                 /* the tongue stops growing with the screen */
  .fa-header__decor{left:50%;width:390px;transform:translateX(-50%)}
}
@media (min-width:1024px){
  /* header — the design system's desktop bar replaces the traced mobile one.
     Figma: Header / Desktop / "Header - Login + Points" (1440 wide, bar 78 tall).
     Every number is from that node; the side padding and the two gaps close in
     from 140 / 88 at 1440 to 40 / 32 at 1024 so the points line still fits. */
  :root{ --fa-bar-h:78px; }
  .fa-header__decor,.fa-header__shape,.fa-header__content,.fa-header__notch--orb{display:none}
  .fa-dh{display:block;position:relative;height:78px}
  .fa-dh__bar{position:relative;z-index:2;height:78px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    gap:clamp(32px, calc((100vw - 1024px) * .134 + 32px), 88px);
    padding:18px clamp(40px, calc((100vw - 1024px) * .24 + 40px), 140px);
    background:#fff;border-radius:0 0 16px 16px;filter:drop-shadow(0 4px 10px rgba(38,48,61,.15))}
  .fa-dh__start{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:24px}
  .fa-dh__end{flex:1 1 0;min-width:0;height:40px;display:flex;align-items:center;justify-content:flex-end}
  .fa-dh__logo{flex:none;width:147px;display:flex}
  .fa-dh__logo img,.fa-dh__points img{display:block}
  /* avatar: a 31.5 ring (1.969 stroke) centred in its 42 box */
  .fa-dh__avatar{flex:none;position:relative;width:31.5px;height:31.5px;margin:5.25px;padding:0;box-sizing:border-box;
    border:1.969px solid var(--ds-blue);border-radius:32.484px;background:#fff;cursor:pointer}
  .fa-dh__avatar img{position:absolute;left:3.31px;top:7.87px}
  /* the 42px divider is drawn horizontal in the file and stood on its end */
  .fa-dh__rule{align-self:stretch;width:0;position:relative;flex:none}
  .fa-dh__rule img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(90deg)}
  .fa-dh__points{display:flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;
    color:var(--ds-blue);font:400 16px/20px var(--ds-font)}
  .fa-dh__points b{font-weight:600;line-height:16px;text-decoration:underline;text-underline-position:from-font}
  .fa-dh__menu{width:42px;height:42px;display:grid;place-items:center;padding:0;border:0;background:none;cursor:pointer}
  .fa-dh__menu span{position:relative;display:block;width:31.5px;height:21px}
  .fa-dh__menu img{position:absolute;left:0;bottom:0}
  /* the tongue and the orb hang under the bar, 2.5px left of centre as drawn */
  .fa-dh__notch{position:absolute;z-index:3;top:78px;left:calc(50% - 2.5px);transform:translateX(-50%);
    width:240.997px;height:78.788px;pointer-events:none}
  .fa-dh__union{position:absolute;left:.58px;top:0;width:297.33px;height:78.892px;
    display:flex;align-items:center;justify-content:center}
  .fa-dh__union img{flex:none;transform:rotate(90deg)}

/* ============ DESKTOP · the category as a list beside a story player ============
   Laid out like the lobby's split option: title, search and a compact list on
   the right; on the left a vertical story card playing the row in focus, with the
   next one peeking out behind it. Below 1024px none of this applies. */
.split{display:contents}
.player,.row__txt,.row__bar{display:none}
@keyframes rowFill{to{width:100%}}

@media (min-width:1024px){
  :root{ --gutter:clamp(40px,7.6vw,110px); }
  .split{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr;
    column-gap:clamp(56px,6vw,120px);
    padding:128px max(var(--gutter), calc((100% - 1440px) / 2 + var(--gutter))) 96px;
    background:
      radial-gradient(900px 620px at 92% 0%, #FFDCF3 0%, rgba(255,220,243,0) 70%),
      radial-gradient(800px 600px at 30% 100%, #D6ECFF 0%, rgba(214,236,255,0) 72%),
      linear-gradient(180deg,#EFEDFF 0%,#F7F0FB 45%,#FFF6ED 100%)}
  .split > .arc{grid-column:1;grid-row:1}
  .split > .list{grid-column:1;grid-row:2}
  .split > .player{grid-column:2;grid-row:1 / span 2}

  /* the title block, set to the right like the lobby's headline */
  .arc .lead{padding:0;align-items:flex-start;text-align:right}
  .lead__home{margin-bottom:26px}
  .arc h2{font-size:clamp(72px,6.4vw,96px);line-height:1}
  .arc .lead__sub{justify-content:flex-start;margin-top:18px;font-size:20px}

  /* the list loses its band and becomes a compact column of rows */
  .list{margin:40px 0 0;padding:0;background:none;border-radius:0;overflow:visible}
  .list__head{padding:0}
  .seek{margin:20px 0 0}
  .seek__reset{margin-inline:0}
  .list__rows{margin-top:28px;padding:12px 0 0;border-top:1px solid rgba(4,15,33,.1)}
  .list.has-sel .list__rows{padding-top:12px}
  .row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;align-items:center;column-gap:16px;
    padding:10px 12px;border-radius:16px;transition:background .3s var(--ease), box-shadow .3s var(--ease)}
  .row + .row{margin-top:4px}
  .row__v{width:64px;height:64px;aspect-ratio:auto;border-radius:14px;border:0;box-shadow:none}
  .row__v::after{background:rgba(6,7,16,.04)}
  .row__kicker,.row h4,.row__play,.row__meta{display:none}
  .row__txt{display:block;min-width:0;opacity:0;transform:translateY(12px);
    transition:opacity .6s var(--ease) calc(var(--d,0s) + .45s), transform .8s var(--ease) calc(var(--d,0s) + .45s)}
  .row.in .row__txt{opacity:1;transform:none}
  .row__txt b{display:block;font:700 19px/1.15 var(--pf);color:var(--ink)}
  .row__txt small{display:block;margin-top:5px;font:400 14px/1.2 var(--pf);color:var(--ds-gray);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row__info{padding:0}
  .row__bar{display:block;grid-column:1 / -1;height:2px;margin:10px 0 -4px;border-radius:2px;
    background:rgba(4,15,33,.06);overflow:hidden;opacity:0;transition:opacity .3s}
  .row__bar b{display:block;height:100%;width:0;background-image:var(--ds-gradient)}
  .row:hover{background:rgba(255,255,255,.55)}
  .row.is-now{background:rgba(255,255,255,.82);box-shadow:0 8px 20px rgba(58,26,124,.08)}
  .row.is-now .row__bar{opacity:1}
  .row.is-now .row__bar b{animation:rowFill 5s linear forwards}
  .row.in.open .row__v{transform:none;box-shadow:none}
  .row.in.open .row__v video{transform:none}
  .list__more{display:inline-flex;width:auto;margin:24px 0 0;padding:0 30px}

  /* the player: sticky under the bar, as tall as the screen allows */
  .player{display:block;position:sticky;top:110px;align-self:start;
    --ph:min(711px, calc(100svh - 150px)); --pw:calc(var(--ph) * 400 / 711);
    width:calc(var(--pw) + 90px);height:calc(var(--ph) + 40px)}
  .pcard{position:absolute;top:0;right:0;width:var(--pw);height:var(--ph);border-radius:24px;overflow:hidden;
    background:#11121C;border:1.5px solid rgba(255,255,255,.72);box-shadow:0 26px 50px rgba(58,26,124,.32);color:#fff;
    opacity:0;transform:translateY(40px) scale(.85);pointer-events:none;
    transition:transform .8s var(--ease), opacity .8s var(--ease)}
  .pcard::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(to top,rgba(6,7,16,.92) 0%,rgba(6,7,16,.5) 34%,rgba(6,7,16,0) 66%),
               linear-gradient(to bottom,rgba(6,7,16,.5) 0%,transparent 26%)}
  .pcard.is-front{opacity:1;transform:none;z-index:3;pointer-events:auto;cursor:pointer}
  .pcard.is-next{opacity:.9;z-index:2;transform:translateX(-86px) translateY(18px) rotate(-6deg) scale(.93)}
  .pcard__v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pcard__crest{position:absolute;z-index:2;top:52px;left:16px;right:16px;height:128px;
    display:flex;align-items:center;justify-content:center;gap:12px;transition:opacity .4s var(--ease)}
  .pcard__crest img{max-height:128px;max-width:70%;filter:drop-shadow(0 8px 22px rgba(6,7,16,.55))}
  .pcard__crest.duo img{max-height:100px;max-width:40%}
  .pcard__crest em{font-style:normal;font-weight:300;font-size:40px;opacity:.85}
  .pcard__copy{position:absolute;z-index:2;right:24px;left:24px;bottom:24px;text-align:center;transition:opacity .4s var(--ease)}
  .pcard__copy b{display:block;font:700 30px/1.1 var(--fa-font)}
  .pcard__copy span{display:block;margin-top:8px;font:400 16px/1.3 var(--fa-font);opacity:.9}
  .pcard__copy .ds-btn{margin-top:18px;height:48px;border-radius:24px}
  .pcard.is-next .pcard__copy,.pcard.is-next .pcard__crest{opacity:0}
  .player__bars{position:absolute;z-index:4;top:14px;right:16px;width:calc(var(--pw) - 32px);display:flex;gap:4px}
  .player__bars i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
  .player__bars i b{display:block;height:100%;width:0;background:#fff}
  .player__bars i.done b{width:100%}
  .player__bars i.on b{animation:rowFill 5s linear forwards}

  /* the search opens its choices right under the bar: no dim, the page keeps
     scrolling, a click anywhere outside closes it */
  body.sheet-open{overflow:visible}
  .seek{position:relative;z-index:31}
  .seek__seg.is-on{background:var(--ds-light-blue-1)}
  .sheet{position:relative;inset:auto;height:0;z-index:30}
  .sheet__dim{position:fixed;inset:0;background:transparent}
  .sheet__panel{position:absolute;z-index:31;top:12px;left:0;right:0;bottom:auto;width:auto;
    max-height:min(440px, calc(100svh - 240px));padding:14px 0;border-radius:20px;
    background:#fff;border:1px solid rgba(4,15,33,.06);box-shadow:0 20px 40px rgba(58,26,124,.16);
    transform:translateY(-8px);opacity:0;transition:transform .35s var(--glide), opacity .25s linear}
  .sheet.open .sheet__panel{transform:none;opacity:1}
  .sheet__handle,.sheet__tabs{display:none}
  .sheet__clear,.sheet__clear[hidden]{display:none}   /* it lives under the search bar on desktop */
  /* sized to the desktop style guide: 20 demi question, 44px buttons, compact choices */
  .sheet__x{display:grid;place-items:center;position:absolute;top:10px;left:10px;z-index:2;width:32px;height:32px;
    border-radius:50%;color:var(--ink);background:#F3F4F7;transition:background .2s var(--ease)}
  .sheet__x:hover{background:#E8EAEF}
  .sheet__x svg{width:14px;height:14px}
  .sheet__body{padding:4px 18px 14px}
  .sheet__q{margin:0 0 12px;padding-left:44px;font:var(--ds-20-demi)}
  .sheet__opts,.sheet__opts--when{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .sheet__opt{aspect-ratio:auto;height:96px;border-radius:12px;padding:8px 6px;gap:2px}
  .sheet__opt img{top:14%;max-height:36%}
  .sheet__opt b{font-size:14px}
  .sheet__opt small{font-size:12px}
  .sheet__opt--all b{font-size:16px}
  .sheet__opts--when .sheet__opt{height:56px}
  .sheet__foot{padding:12px 18px 0}
  .sheet__cta{flex:none;height:44px;border-radius:22px;padding:6px 24px;margin-inline-start:auto;font:var(--ds-btn)}

  /* footer — the groups side by side */
  .foot{padding:64px var(--gutter) 40px}
  .foot__groups{flex-direction:row;gap:clamp(48px,8vw,120px)}
  .foot__legal{width:auto;max-width:900px}

  /* the experience view — split: the footage keeps its 9:16 at full height on the
     right, dissolving into the dark the way the mobile sheet does, and every
     detail sits on the left with no scrolling. Arrows under the footage. */
  .reel{--vw:min(calc(100svh * 9 / 16 * 1.7), 60vw);
    background:radial-gradient(60% 50% at 20% 10%,rgba(130,74,234,.28) 0%,transparent 70%),
               radial-gradient(50% 40% at 10% 100%,rgba(27,94,206,.26) 0%,transparent 70%),#06070F}
  .reel__slide{display:grid;grid-template-columns:var(--vw) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
    overflow:hidden}
  .reel__stage{position:relative;grid-column:1;grid-row:1 / span 2;height:100%;overflow:hidden}
  /* clear, then a soft ramp to ink toward the details — the mobile veil's own steps, turned sideways */
  .reel__stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(to left,
      rgba(6,7,16,0) 0%, rgba(6,7,16,0) 58%, rgba(6,7,16,.28) 68%,
      rgba(6,7,16,.62) 80%, rgba(6,7,16,.86) 91%, #06070F 100%)}
  .reel__veil,.reel__copy,.reel__hint{display:none}
  .reel__foot{height:30%}
  .reel__crest{top:clamp(64px,10vh,110px)}

  /* the details column */
  html .reel__slide .reel__detail{grid-column:2;grid-row:1;align-self:stretch;min-height:0;justify-self:start;
    display:flex;flex-direction:column;
    width:100%;max-width:640px;box-sizing:border-box;overflow-y:auto;scrollbar-width:none;pointer-events:auto;
    padding:clamp(96px,14vh,140px) clamp(20px,2.5vw,40px) 0 clamp(32px,3.5vw,64px)}
  .reel__detail::-webkit-scrollbar{display:none}
  /* sits at the foot of its column, but scrolls from the top when a short screen can't hold it */
  .reel__detail > .rd__title{margin-top:auto}
  .rd__kicker{display:none}
  .rd__meta{display:flex;margin:0}
  .rd__title{margin-top:14px;text-align:right;font-size:clamp(42px,4.2vw,68px);line-height:1}
  .rd__about{margin:20px 0 0;max-width:46ch;text-align:right;font:400 19px/1.45 var(--fa-font)}
  /* the facts lose their glass: dates and packages in two columns, the price across the foot */
  .rd__glass{margin-top:34px;padding:0;border:0;border-radius:0;background:none;
    backdrop-filter:none;-webkit-backdrop-filter:none;text-align:right;
    display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:clamp(28px,3vw,48px);row-gap:12px}
  .rd__glass > :nth-child(1){grid-column:1;grid-row:1}
  .rd__glass > :nth-child(2){grid-column:1;grid-row:2}
  .rd__glass > :nth-child(3){display:none}
  .rd__glass > :nth-child(4){grid-column:2;grid-row:1}
  .rd__glass > :nth-child(5){grid-column:2;grid-row:2}
  .rd__glass > :nth-child(6){grid-column:1 / -1;grid-row:3}
  .rd__lbl{font-size:14px;opacity:.55;letter-spacing:.02em}
  .rd__dates,.rd__tiers{margin:0;justify-content:flex-start;gap:10px}
  .rd__dates i{display:none}
  .rd__dates span,.rd__tiers span{height:44px;padding:0 20px;border-radius:22px;display:inline-flex;align-items:center;
    font:400 17px/1 var(--fa-font);background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.22)}
  .rd__price{margin-top:22px}
  .rd__price b{font-size:30px}
  .rd__price span{font-size:16px}

  /* the buttons: under the details, side by side; the "you have enough" banner above them */
  html .reel__slide .reel__act{grid-column:2;grid-row:2;position:relative;bottom:auto;justify-self:start;
    width:100%;max-width:640px;box-sizing:border-box;height:auto;margin:0;opacity:1;transform:none;pointer-events:auto;
    display:flex;flex-wrap:wrap;gap:12px;background:none;
    padding:24px clamp(20px,2.5vw,40px) clamp(36px,6vh,56px) clamp(32px,3.5vw,64px)}
  .reel__act::before{content:"";flex:0 0 100%;height:1px;margin-bottom:14px;background:rgba(255,255,255,.14)}
  .rd__have{flex:0 0 100%;box-sizing:border-box;margin:0 0 4px;padding:12px 12px 12px 16px}
  .rd__have__tx b{font-size:17px}
  .rd__have__tx span{font-size:14px}
  .rd__have__go{height:40px;line-height:40px;padding:0 22px;font-size:16px}
  .rd__cta,.rd__buy{flex:1 1 220px;width:auto;margin:0;height:54px;border-radius:27px;font-size:18px}
  .rd__buy svg{width:16px;height:16px}
  @media (max-width:1279px){

    .rd__glass > :nth-child(5){grid-column:1;grid-row:4}
    .rd__glass > :nth-child(6){grid-row:5}
  }

  .reel__bars{top:22px;left:auto;right:22px;width:calc(var(--vw) - 44px)}
  .reel__close,.how__close{top:28px;right:auto;left:32px}
  .reel__nav{display:grid;place-items:center;position:absolute;top:auto;bottom:28px;z-index:6;width:52px;height:52px;
    border-radius:50%;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.24);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:opacity .3s var(--ease), transform .2s var(--ease)}
  .reel__nav svg{width:22px;height:22px}
  .reel__nav:hover{transform:scale(1.06)}
  .reel__nav:disabled{opacity:.25;pointer-events:none}
  .reel__nav--prev{right:calc(var(--vw) / 2 - 59px)}   /* RTL: back on the right, next on the left */
  .reel__nav--next{right:calc(var(--vw) / 2 + 7px)}

  /* the points switch sits beside the close button, clear of the buy buttons */
  body.reel-open .who--pts{top:32px;left:92px}

  /* the walkthrough takes over the details column; the footage keeps running beside it */
  .how{top:0;bottom:0;left:0;right:var(--vw);width:auto}

  .how__track{top:14%}
  .how__step{padding:6px max(24px, calc(50% - 250px)) 110px}

  /* on desktop the swipe gives way to an accordion: all three steps listed,

  .hacc{position:relative;border-radius:22px;border:1px solid rgba(255,255,255,.1);overflow:hidden;

  .hacc:hover:not(.on){border-color:rgba(255,255,255,.2)}
  .hacc__hd{display:flex;align-items:center;gap:14px;width:100%;padding:18px 22px;text-align:right;cursor:pointer}
  .hacc__n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;

    transition:background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease)}
  .hacc__hd h3{margin:0;font:700 22px/1.15 var(--ds-font);color:#fff;transition:color .35s var(--ease)}
  .hacc__more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
  .hacc__more > div{overflow:hidden}
  .hacc__row{display:grid;grid-template-columns:minmax(0,1fr) clamp(110px,10vw,150px);gap:20px;align-items:center;
    padding:0 22px 20px 70px}
  .hacc__row p{margin:0;font:var(--ds-body3);color:#fff;opacity:.82}
  .hacc__row .how__note{margin-top:12px;color:#fff}
  .hacc__art svg{display:block;width:100%;height:auto;max-height:clamp(110px,16vh,150px);

  @keyframes haccFill{to{width:100%}}
}
@media (min-width:1024px) and (prefers-reduced-motion: reduce){
  .hacc__more,.hacc,.hacc__n{transition:none}
  .hacc.on .hacc__bar{animation:none}
}
@media (max-width:1023px){ .how__acc{display:none} }
.reel__nav{display:none}
@media (min-width:1024px){ .reel__nav{display:grid} }
@media (min-width:1024px) and (prefers-reduced-motion: reduce){
  .pcard,.row__txt{transition:none}

  animation:meFlow 7s linear infinite;box-shadow:0 14px 30px rgba(130,74,234,.28)}

@media (min-width:1024px){

const pool = new Map();
function getVideo(src, preload){
  let v = pool.get(src);
  if(!v){
    v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute('playsinline',''); v.setAttribute('muted','');
    v.preload = preload || 'auto'; v.src = src;
    pool.set(src, v);
  }
  return v;
}
const stopAll = () => pool.forEach(v => v.pause());
function freshVideo(src, preload){          /* never shared — a node lives in one place */
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true;
  v.setAttribute('playsinline',''); v.setAttribute('muted','');
  v.preload = preload || 'metadata'; v.src = src;
  return v;
}
const play = v => { const p = v.play(); if(p && p.catch) p.catch(()=>{}); };
/* Entry animations are registered while the page is built but stay disarmed
   until the intro is over, so nothing plays behind the loading screen.
   Each group re-plays every time its section comes back into view. */
const _entries = [];
function enter(root, items, stepMs, useDefaultMotion){
  items.forEach((n, i) => {
    if (useDefaultMotion !== false) n.classList.add('en');
    n.style.setProperty('--d', (i * stepMs / 1000).toFixed(2) + 's');
  });
  _entries.push(() => {
    const io = new IntersectionObserver(es => es.forEach(e => {
      items.forEach(n => n.classList.toggle('in', e.isIntersecting));
    }), { threshold: 0, rootMargin: '-14% 0px -14% 0px' });
    io.observe(root);
  });
}
function armEntries(){ _entries.forEach(fn => fn()); _entries.length = 0; }

const el = (t,c,h) => { const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n; };
