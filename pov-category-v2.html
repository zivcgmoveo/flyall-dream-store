/* ================= HERO · the category's title, straight into the list ================= */
function buildArc(){
  const root = el('div','arc');
  const LOW = Math.min(...ARC.map(d => num(d.pts))).toLocaleString('en-US');
  const lead = el('div','lead',
    '<a class="lead__home" href="pov-reels-v2.html">' +
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>' +
      'חזרה לעמוד הראשי</a>' +
    '<h2><b>'+(CAT.h || CAT.t)+'</b></h2>'+
    '<p class="lead__sub">'+CAT.n+' חוויות<i></i>החל מ־<b>'+LOW+' נק׳</b> <small class="ils">(₪'+LOW+')</small></p>');
  /* our light green confetti, out of the ring */
  const lmeConfetti = from => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || !from) return;
    const r = from.getBoundingClientRect(), box = el('div', 'lme-confetti');
    box.style.left = (r.left + r.width / 2) + 'px'; box.style.top = (r.top + r.height / 2) + 'px';
    const C = ['#14A160', '#3CCB7F', '#7EE2A8', '#B8F2CF', '#D9F7E6'];
    for (let i = 0; i < 28; i++) {
      const c = el('i'); c.style.background = C[i % C.length]; if (i % 3 === 0) c.style.borderRadius = '50%';
      box.appendChild(c);
      const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 80, x = Math.cos(a) * d, y = Math.sin(a) * d - 30;
      c.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + (Math.random() * 360) + 'deg)', opacity: .9, offset: .45 },
        { transform: 'translate(' + (x * 1.15) + 'px,' + (y + 60) + 'px) rotate(' + (Math.random() * 540) + 'deg) scale(.6)', opacity: 0 }],
        { duration: 1500 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    }
    document.body.appendChild(box); setTimeout(() => box.remove(), 2600);
  };
  /* signed in: a ring with the points you have against the nearest dream here (13.10 sync) */
  const C = 2 * Math.PI * 40;
  const cheap = ARC.reduce((a, d) => num(d.pts) < num(a.pts) ? d : a, ARC[0]);
  const me = el('div','lead__me lme',
    '<span class="lme__ring" aria-hidden="true"><svg viewBox="0 0 92 92"><defs><linearGradient id="lmeG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5ECE"/><stop offset=".5" stop-color="#824AEA"/><stop offset="1" stop-color="#F63DE4"/></linearGradient></defs>' +
      '<circle class="bg" cx="46" cy="46" r="40"/><circle class="fg" cx="46" cy="46" r="40" stroke-dasharray="' + C + '" stroke-dashoffset="' + C + '"/></svg>' +
      '<b class="lme__n"></b></span>' +
    '<span class="lme__tx"><b>יש לך כרגע <span class="lme__have"></span> נקודות</b><small class="lme__left"></small><small class="lme__pp">לאדם בחדר זוגי</small></span>');
  const dream = cheap;   /* always the cheapest experience on the page */
  me._paint = () => {
    const have = document.documentElement.dataset.points === 'enough' ? ENOUGH : BALANCE, price = num(dream.pts), left = Math.max(0, price - have);
    me.querySelector('.lme__n').textContent = Math.round(Math.min(1, have / price) * 100) + '%';
    me.querySelector('.lme__have').textContent = have.toLocaleString('en-US');
    me.querySelector('.lme__left').innerHTML = left
      ? 'עוד <em>' + left.toLocaleString('en-US') + ' נק׳</em> לחוויה המשתלמת ביותר'
      : '<em>מספיק</em> כדי לרכוש את החוויה המשתלמת ביותר בנקודות';
    /* enough: the same card, and on first sight a little of our green confetti from the ring */
    if (!left && !me._cheered) { me._cheered = true; setTimeout(() => lmeConfetti(me.querySelector('.lme__ring')), 900); }
    if (left) me._cheered = false;
    requestAnimationFrame(() => { me.querySelector('.fg').style.strokeDashoffset = String(C * (1 - Math.min(1, have / price))); });
  };
  lead.appendChild(me);
  setTimeout(me._paint, 450);
  /* guest: the same slot asks why pay in money when points will do */
  const why = el('div','lead__why',
    '<p><b>למה לשלם בכסף,</b> <br>כשאפשר לשלם <em>בנקודות?</em></p>' +
    '<small>מצטרפים, צוברים נקודות ומתחילים להגשים</small>' +
    '<a href="#join">הצטרף לכרטיס FlyAll<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg></a>');
  lead.appendChild(why);
  root.appendChild(lead);
  enter(root, [...lead.querySelectorAll('h2,.lead__sub,.lead__me,.lead__why')], 110);

  root._shape = () => {};          /* no carousel here any more — the reel still calls these */
  root._arm = () => {};
  return root;
}

/* ================= THE LIST · every experience in the category ================= */
const SORT_IC = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>';

/* one switch for every layout decision the script makes: at 1024px and up the
   page is the desktop design, below it the mobile one (same line as the lobby) */

function buildList(){
  const box = el('section','list ask__panel');

  const head = el('div','list__head',

  /* the search is not free text — its three facets are this category's own
     (league/team, artist/city, style/country) and each one narrows the next */
  const SEEK = CAT.seek;
  const KEYS = ['f1', 'f2', 'm'];

  const monthName = m => MONTHS[m % 100 - 1];
  const LOGO = {};

  ARC.forEach(d => { if (d.logos.length > 1) d.f2.forEach((t, j) => { if (d.logos[j]) LOGO[t] = d.logos[j]; }); });
  const EMPTY = ['הכל', 'הכל', 'תמיד'];
  let sel = { f1:null, f2:null, m:null };
  const fits = (d, q, upto) => KEYS.slice(0, upto).every(k =>
    !q[k] || (k === 'f2' ? d.f2.includes(q[k]) : d[k] === q[k]));
  const label = (k, v) => v == null ? EMPTY[KEYS.indexOf(k)] : k === 'm' ? monthName(v) + ' ' + String(v).slice(2, 4) : v;

  const seek = el('div','seek');
  seek.setAttribute('role','search');
  const segs = SEEK.map(([lab], i) => {
    const b = el('button','seek__seg','<small>' + lab + '</small><b></b>');
    b.type = 'button';
    /* while the choices are open under the bar, a segment just moves to its step */
    b.onclick = () => (DESK.matches && sheet.classList.contains('open')) ? showStep(i) : openSheet(i);
    seek.appendChild(b);

  const goBtn = el('button','seek__go',

  goBtn.type = 'button'; goBtn.setAttribute('aria-label','חיפוש');
  goBtn.onclick = () => openSheet(0);
  seek.appendChild(goBtn);
  function paintSeek(){
    box.classList.toggle('has-sel', KEYS.some(k => sel[k] != null));
    segs.forEach((b, i) => {
      const k = KEYS[i];
      b.querySelector('b').textContent = label(k, sel[k]);
      b.classList.toggle('is-set', sel[k] != null);
    });
  }

  const rows = el('div','list__rows');
  /* the way out at the foot of the list is the next world, round in a loop:
     sport → shows → festivals → sport. It stays on this file, so the "enough
     points" version keeps pointing at itself. */
  const WORLDS = Object.keys(CATS);
  const hereKey = CATS[CAT_KEY] ? CAT_KEY : WORLDS[0];
  const nextKey = WORLDS[(WORLDS.indexOf(hereKey) + 1) % WORLDS.length];
  /* how each world is named on the button — "ספורט" alone reads as the subject, not the events */
  const NEXT_NAME = { sport:'אירועי ספורט', shows:'הופעות', fest:'פסטיבלים' };
  const more = el('a','list__more ds-btn ds-btn--secondary-grad ds-btn--block',
    'גלה גם על ' + (NEXT_NAME[nextKey] || CATS[nextKey].t) + ARROW);
  more.href = location.pathname.split('/').pop() + '?c=' + nextKey;
  const reset = el('div','seek__reset','<div><button type="button">ניקוי הבחירה</button></div>');
  reset.querySelector('button').onclick = () => {
    sel = { f1:null, f2:null, m:null };
    if (sheet.classList.contains('open')) {
      draft = { f1:null, f2:null, m:null };
      if (step === 0) paintState(); else showStep(0);
    } else paintSeek();
    render();
  };
  box.append(head, seek, reset, rows, more);

  /* ---- the sheet ---- */
  const sheet = el('div','sheet',
    '<div class="sheet__dim"></div>' +
    '<div class="sheet__panel" role="dialog" aria-modal="true" aria-label="חיפוש ' + CAT.t + '">' +
      '<div class="sheet__handle" aria-hidden="true"><i class="sheet__grip"></i></div>' +

      '<div class="sheet__tabs"></div>' +
      '<button class="sheet__clear" type="button">ניקוי הבחירה</button>' +
      '<div class="sheet__body">' +
        '<div class="sheet__stage"><h4 class="sheet__q"></h4><div class="sheet__opts"></div></div>' +
      '</div>' +
      '<div class="sheet__foot">' +
        '<button class="sheet__cta ds-btn ds-btn--primary" type="button"></button>' +
      '</div>' +
    '</div>');
  /* mobile: a sheet over the page. Desktop: the same panel, hung under the search bar */
  const placeSheet = () => { if (DESK.matches) reset.after(sheet); else document.body.appendChild(sheet); };
  placeSheet();
  DESK.addEventListener('change', () => { if (sheet.classList.contains('open')) closeSheet(); placeSheet(); });
  const tabsEl = sheet.querySelector('.sheet__tabs'), qEl = sheet.querySelector('.sheet__q'),
        optsEl = sheet.querySelector('.sheet__opts'), cta = sheet.querySelector('.sheet__cta');
  const tabs = SEEK.map(([lab], i) => {
    const t = el('button','sheet__tab','<small>' + lab + '</small><b></b>');

    t.onclick = () => showStep(i);
    tabsEl.appendChild(t);
    return t;
  });
  let draft = null, step = 0, advance = null, swapping = null;
  const bodyEl = sheet.querySelector('.sheet__body'), stage = sheet.querySelector('.sheet__stage');
  const clearBtn = sheet.querySelector('.sheet__clear');
  const valOf = o => o.dataset.v === '' ? null : KEYS[step] === 'm' ? +o.dataset.v : o.dataset.v;

  /* builds one step's choices — only what's still possible given the earlier steps */
  function build(i){
    step = i;
    const k = KEYS[i];
    qEl.textContent = SEEK[i][1];
    const pool = ARC.filter(d => fits(d, draft, i));
    const vals = [];
    pool.forEach(d => (k === 'f2' ? d.f2 : [d[k]]).forEach(v => { if (!vals.includes(v)) vals.push(v); }));
    if (k === 'm') vals.sort((a, b) => a - b);
    const count = v => pool.filter(d => k === 'f2' ? d.f2.includes(v) : d[k] === v).length;
    optsEl.className = 'sheet__opts' + (k === 'm' ? ' sheet__opts--when' : '');
    optsEl.replaceChildren();
    [null, ...vals].forEach(v => {
      const o = el('button','sheet__opt' + (v == null ? ' sheet__opt--all' : ''));
      o.type = 'button';
      o.dataset.v = v == null ? '' : v;
      const c = v == null ? pool.length : count(v);
      if (k === 'm') {
        o.innerHTML = '<b>' + (v == null ? 'תמיד' : monthName(v)) + '</b><small>' +
          (v == null ? c + ' חוויות' : String(v).slice(0, 4)) + '</small>';
      } else {
        const d = v == null ? null : pool.find(x => k === 'f2' ? x.f2.includes(v) : x[k] === v);
        if (d) o.style.backgroundImage = 'url("' + d.poster + '")';
        o.innerHTML = (v != null && LOGO[v] ? '<img src="assets/logos/' + LOGO[v] + '" alt="">' : '') +
          '<b>' + (v == null ? 'הכל' : v) + '</b><small>' + c + (c === 1 ? ' חוויה' : ' חוויות') + '</small>';
      }
      o.onclick = () => pick(k, v);
      optsEl.appendChild(o);
    });
    paintState();
  }
  /* everything that reflects the draft, updated in place — nothing is rebuilt on a tap */
  function paintState(){
    /* desktop has no tabs in the panel: the bar's own segments show the step and the draft */
    if (DESK.matches && sheet.classList.contains('open'))
      box.classList.toggle('has-sel', KEYS.some(k => draft[k] != null || sel[k] != null));
    if (DESK.matches && sheet.classList.contains('open')) segs.forEach((b, j) => {
      b.classList.toggle('is-on', j === step);
      b.classList.toggle('is-set', draft[KEYS[j]] != null);
      b.querySelector('b').textContent = label(KEYS[j], draft[KEYS[j]]);
    });
    tabs.forEach((t, j) => {
      t.classList.toggle('is-on', j === step);
      t.classList.toggle('is-set', draft[KEYS[j]] != null);
      t.querySelector('b').textContent = label(KEYS[j], draft[KEYS[j]]);
    });
    [...optsEl.children].forEach(o => o.classList.toggle('is-on', valOf(o) === draft[KEYS[step]]));
    clearBtn.hidden = !KEYS.some(k => draft[k] != null);
    paintCta();
  }
  /* glide to another step: out one way, the height eases, in from the other side */
  function showStep(i){
    clearTimeout(advance);
    if (i === step) { paintState(); return; }
    clearTimeout(swapping);
    const dir = i > step ? 1 : -1;
    stage.style.setProperty('--dir', dir);
    const h0 = bodyEl.getBoundingClientRect().height;
    bodyEl.style.height = h0 + 'px';
    step = i;
    tabs.forEach((t, j) => t.classList.toggle('is-on', j === i));
    segs.forEach((b, j) => b.classList.toggle('is-on', DESK.matches && j === i));
    stage.classList.add('out');
    swapping = setTimeout(() => {
      build(i);
      stage.classList.remove('out');
      stage.classList.add('pre');
      bodyEl.style.height = 'auto';
      const h1 = bodyEl.getBoundingClientRect().height;
      bodyEl.style.height = h0 + 'px';
      void bodyEl.offsetHeight;                 /* commit the start before moving */
      bodyEl.style.height = h1 + 'px';
      stage.classList.remove('pre');
      swapping = setTimeout(() => { bodyEl.style.height = ''; }, 520);
    }, 260);
  }
  function pick(k, v){
    draft[k] = v;
    /* a later choice that no longer fits is let go */
    KEYS.slice(KEYS.indexOf(k) + 1).forEach(kk => {
      if (draft[kk] != null && !ARC.some(d => fits(d, draft, 3))) draft[kk] = null;
    });
    paintState();
    /* the choice lights up first, then the sheet moves on */
    if (step < 2) advance = setTimeout(() => showStep(step + 1), 420);
  }
  function paintCta(){
    const n = ARC.filter(d => fits(d, draft, 3)).length;
    cta.textContent = 'הצגת ' + n + (n === 1 ? ' חוויה' : ' חוויות');
  }
  function openSheet(i){
    draft = { ...sel };
    clearTimeout(swapping);
    stage.classList.remove('out', 'pre');
    bodyEl.style.height = '';
    build(i);
    sheet.classList.add('open');
    document.body.classList.add('sheet-open');
    paintState();
    /* make room for the choices when the bar sits low on the screen */
    if (DESK.matches) requestAnimationFrame(() => {
      const r = seek.getBoundingClientRect();
      if (r.top > 150 && r.top + 560 > innerHeight) scrollBy({ top: r.top - 110, behavior: 'smooth' });
    });
  }
  function closeSheet(){
    clearTimeout(advance);
    sheet.classList.remove('open');
    document.body.classList.remove('sheet-open');
    segs.forEach(b => b.classList.remove('is-on'));
    paintSeek();                     /* a draft that wasn't applied leaves the bar as it was */
  }
  sheet.querySelector('.sheet__dim').onclick = closeSheet;
  sheet.querySelector('.sheet__x').onclick = closeSheet;

  /* drag the handle down: the sheet follows the finger, the dim thins with it, and
     on release it either goes (far enough, or flicked) or settles back up */
  const panel = sheet.querySelector('.sheet__panel'), dim = sheet.querySelector('.sheet__dim');
  const handle = sheet.querySelector('.sheet__handle');
  let drag = null;
  handle.addEventListener('pointerdown', e => {
    drag = { y: e.clientY, t: e.timeStamp, dy: 0, v: 0 };
    handle.setPointerCapture(e.pointerId);
    panel.style.transition = dim.style.transition = 'none';
    sheet.classList.add('drag');
  });
  handle.addEventListener('pointermove', e => {
    if (!drag) return;
    const dy = Math.max(0, e.clientY - drag.y);
    const dt = Math.max(1, e.timeStamp - drag.t);
    drag.v = (dy - drag.dy) / dt;
    drag.dy = dy; drag.t = e.timeStamp;
    panel.style.transform = 'translateY(' + dy + 'px)';
    dim.style.opacity = Math.max(0, 1 - dy / panel.offsetHeight);
  });
  const release = () => {
    if (!drag) return;
    const gone = drag.dy > panel.offsetHeight * .28 || drag.v > .6;
    drag = null;
    sheet.classList.remove('drag');
    panel.style.transition = dim.style.transition = '';
    if (gone) closeSheet();
    panel.style.transform = dim.style.opacity = '';
  };
  handle.addEventListener('pointerup', release);
  handle.addEventListener('pointercancel', release);
  clearBtn.onclick = () => {
    draft = { f1:null, f2:null, m:null };
    if (step === 0) paintState(); else showStep(0);
  };
  cta.onclick = () => { sel = { ...draft }; closeSheet(); paintSeek(); render(); };
  addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('open')) closeSheet(); });
  paintSeek();

  let sort = 0;
  const sortBtn = head.querySelector('.list__sort');
  sortBtn.onclick = () => {
    sort = 1 - sort;
    sortBtn.querySelector('span').textContent = SORTS[sort][0];
    render();
  };

  let live = null, paused = false, hovered = null;
  /* one row per experience; the thumbnail is a poster until it's the one playing */
  const rowEls = ARC.map((d, i) => {
    const [title, place] = d.event.split(' · ');
    const r = el('article','row',
      '<div class="row__v">' +
        '<span class="row__kicker">' + d.type + ' · ' + place + '</span>' +
        '<h4>' + title + '</h4>' +
        '<span class="row__play">' + PLAY_IC + '</span>' +
      '</div>' +
      '<div class="row__txt"><b>' + title + '</b><small>' + place + ' · ' + d.date + '</small></div>' +
      '<div class="row__info">' +
        '<p class="row__meta"><span>' + place + '</span><i></i><span>' + d.date + '</span></p>' +
        '<span class="row__pill">החל מ־<b>' + d.pts + ' נק׳</b> <small class="ils">(₪' + d.pts + ')</small></span>' +
      '</div>' +
      '<i class="row__bar"><b></b></i>');
    const v = freshVideo(d.src, 'none');
    v.removeAttribute('src'); v.dataset.src = d.src; v.poster = d.poster;
    r.querySelector('.row__v').prepend(v);
    r.setAttribute('role','button'); r.tabIndex = 0;
    r.setAttribute('aria-label', d.event);
    const go = () => { quiet(); openReel(i); };
    r.addEventListener('click', go);
    r.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    /* hovering a row opens its clip over the whole row, and that one plays */
    r.addEventListener('mouseenter', () => { hovered = r; r.classList.add('open'); playback(); });
    r.addEventListener('mouseleave', () => { hovered = null; r.classList.remove('open'); playback(); });
    return r;
  });

  /* rows float in as they reach the screen, a beat apart when they arrive together */
  let io = null;
  function watch(){
    if (!io) return;
    io.disconnect();
    [...rows.children].forEach(r => io.observe(r));
  }
  _entries.push(() => {
    io = new IntersectionObserver(es => {
      let k = 0;
      es.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.style.setProperty('--d', (k++ * .22).toFixed(2) + 's');
        e.target.classList.add('in');
        io.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -12% 0px' });
    watch();
    requestAnimationFrame(playback);
  });

  function render(){
    const list = ARC.map((d, i) => [d, rowEls[i]])
      .filter(([d]) => fits(d, sel, 3))
      .sort((a, b) => SORTS[sort][1](a[0], b[0]));
    rows.replaceChildren();
    list.forEach(([, r]) => { r.classList.remove('in', 'on'); rows.appendChild(r); });
    if (!list.length) rows.appendChild(el('p','list__empty','אין עדיין חוויות בסינון הזה'));
    /* the player follows the list as it now stands: filtered and sorted */
    order = list.map(([d]) => ARC.indexOf(d));
    if (DESK.matches) show(0);
    watch();
    requestAnimationFrame(playback);
  }

  /* only one thumbnail plays: the row nearest the middle of the screen */
  function playback(){
    if (DESK.matches) {
      if (live) { live.classList.remove('on'); live.querySelector('video').pause(); live = null; }
      const f = pcards[order[at]];
      if (f && !paused && pseen) play(f.querySelector('video'));
      return;
    }
    if (paused || !io) return;
    const mid = innerHeight * .55;
    let best = null, dist = Infinity;
    [...rows.querySelectorAll('.row')].forEach(r => {
      const b = r.getBoundingClientRect();
      if (b.bottom < 0 || b.top > innerHeight) return;
      const d = Math.abs(b.top + b.height / 2 - mid);
      if (d < dist) { dist = d; best = r; }
    });
    if (hovered && hovered.isConnected) best = hovered;
    if (best === live) {             /* same row — make sure it didn't stall */
      if (live && live.querySelector('video').paused) play(live.querySelector('video'));
      return;
    }
    if (live) { live.classList.remove('on'); live.querySelector('video').pause(); }
    live = best;
    if (live) {
      const v = live.querySelector('video');
      if (!v.src) v.src = v.dataset.src;
      live.classList.add('on');
      play(v);
    }
  }
  function quiet(){
    paused = true;
    clearTimeout(ptimer);
    pcards.forEach(c => c.querySelector('video').pause());
    if (live) { live.classList.remove('on'); live.querySelector('video').pause(); }
    live = null;
  }
  addEventListener('scroll', () => requestAnimationFrame(playback), { passive:true });
  document.addEventListener('reel:open', quiet);
  document.addEventListener('reel:close', () => { paused = false; playback(); tick(); });

  /* ---- desktop only: a story player beside the list ----
     It plays the row in focus, with the next row's card peeking out behind it,
     and moves down the list by itself; hovering a row brings that one forward. */
  const player = el('aside','player');
  player.setAttribute('aria-label','תצוגה מקדימה');
  const pcards = ARC.map((d, i) => {
    const [title, place] = d.event.split(' · ');
    const c = el('div','pcard');
    const v = freshVideo(d.src, 'none');
    v.removeAttribute('src'); v.dataset.src = d.src; v.poster = d.poster; v.className = 'pcard__v';
    c.appendChild(v);
    const logos = d.logos.map(f => '<img src="assets/logos/' + f + '" alt="">')
                         .join(d.logos.length > 1 ? '<em>&amp;</em>' : '');
    if (d.logos.length) c.appendChild(el('div','pcard__crest' + (d.logos.length > 1 ? ' duo' : ''), logos));
    c.appendChild(el('div','pcard__copy',
      '<b>' + title + '</b><span>' + [place, d.date].join(' · ') + '</span>' +
      '<button class="ds-btn ds-btn--secondary-grad ds-btn--block" type="button">' + CTA_LABEL + '</button>'));
    c.addEventListener('click', () => { if (c.classList.contains('is-front')) { quiet(); openReel(i); } });
    player.appendChild(c);
    return c;
  });
  const pbars = el('div','player__bars');
  player.appendChild(pbars);

  let order = [], at = 0, ptimer = null, phold = false, pseen = false;
  const refill = n => { n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; };
  function show(k){
    at = k;
    document.dispatchEvent(new CustomEvent('fa:story', { detail: order[at] }));   /* the points ring above follows the story */
    const i = order[at], j = order.length > 1 ? order[(at + 1) % order.length] : -1;
    pcards.forEach((c, n) => {
      c.classList.toggle('is-front', n === i);
      c.classList.toggle('is-next', n === j);
      const v = c.querySelector('video');
      if (n === i) { if (!v.src) v.src = v.dataset.src; if (!paused && pseen) play(v); }
      else v.pause();
    });
    rowEls.forEach((r, n) => { r.classList.toggle('is-now', n === i); if (n === i) refill(r.querySelector('.row__bar b')); });
    while (pbars.children.length < order.length) pbars.appendChild(el('i','','<b></b>'));
    while (pbars.children.length > order.length) pbars.lastChild.remove();
    [...pbars.children].forEach((s, n) => { s.className = n < at ? 'done' : n === at ? 'on' : ''; if (n === at) refill(s.firstChild); });
    tick();
  }
  function tick(){
    clearTimeout(ptimer);
    if (DESK.matches && pseen && !phold && !paused && order.length > 1)
      ptimer = setTimeout(() => show((at + 1) % order.length), 5000);
  }
  rowEls.forEach((r, i) => {
    r.addEventListener('mouseenter', () => {
      if (!DESK.matches) return;
      phold = true;
      const k = order.indexOf(i);
      if (k > -1 && k !== at) show(k); else tick();
    });
    r.addEventListener('mouseleave', () => { phold = false; tick(); });
  });
  player.addEventListener('mouseenter', () => { phold = true; tick(); });
  player.addEventListener('mouseleave', () => { phold = false; tick(); });
  _entries.push(() => {
    new IntersectionObserver(es => { pseen = es[0].isIntersecting; if (DESK.matches) show(at); }, { threshold: .2 }).observe(player);
  });
  DESK.addEventListener('change', () => {
    if (DESK.matches) show(at);
    else { clearTimeout(ptimer); pcards.forEach(c => c.querySelector('video').pause());
           rowEls.forEach(r => r.classList.remove('is-now')); playback(); }
  });
  box._player = player;

  render();
  return box;
}

      '<path d="M28 34 a7 7 0 0 1 14 0 v13"/>' +
      '<path d="M42 40 a6 6 0 0 1 12 0 v10"/>' +
      '<path d="M14 46 v16 a16 16 0 0 0 16 16 h10 a14 14 0 0 0 14 -14 V48"/>' +
      '<path d="M14 54 a8 8 0 0 0 -10 8"/>' +
    '</g>';
  return '<svg viewBox="0 0 228 236">' + grid + hand + '</svg>';
})();

const ART_FLY = (() => {

/* the little two-note approval, synthesised — no asset to ship or preload */
let actx = null;
function unlockAudio(){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }catch(e){ actx = null; }
}
function chime(){
  if (!actx) return;
  try{
    const t0 = actx.currentTime;
    [[880, 0], [1318.5, .085]].forEach(([f, at]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t0 + at);
      g.gain.exponentialRampToValueAtTime(.07, t0 + at + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + at + .17);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + at); o.stop(t0 + at + .22);
    });
  }catch(e){}
}

function buildHow(){
  const how = el('div','how');
  how.appendChild(el('div','how__veil'));

  const track = el('div','how__track');
  const steps = HOW.map(d => {
    const st = el('section','how__step tone-' + d.tone,
      '<div class="how__art">' + d.art + '</div>' +
      '<div class="how__copy">' +
        '<h3>' + d.h + '</h3>' +
        d.p.map(t => '<p>' + t + '</p>').join('') +
        '<div class="how__note"><b>' + d.note[0] + '</b>' +
          '<span>' + d.note[1] + '</span></div>' +
        (d.cta ? '<button class="how__cta ds-btn ds-btn--primary ds-btn--block">' + d.cta + '</button>' : '') +
      '</div>');
    track.appendChild(st);
    return st;
  });
  how.appendChild(track);

  const dots = el('div','how__dots');
  HOW.forEach(() => dots.appendChild(el('i')));
  how.appendChild(dots);

  /* desktop: the same three steps as an accordion (the CSS shows one or the other) */
  const acc = el('div','how__acc',
    '<h2 class="how__acc-title">איך <b>מגשימים</b> את החלום?</h2>');
  const list = el('div','how__acc-list');
  const rows = HOW.map((d, j) => {
    const it = el('div','hacc tone-' + d.tone,
      '<button class="hacc__hd" type="button" aria-expanded="false">' +
        '<span class="hacc__n">' + (j + 1) + '</span><h3>' + d.h + '</h3></button>' +
      '<div class="hacc__more"><div><div class="hacc__row">' +
        '<div><p>' + d.p.join(' ') + '</p>' +
          '<div class="how__note"><b>' + d.note[0] + '</b><span>' + d.note[1] + '</span></div></div>' +
        '<div class="hacc__art">' + d.art + '</div>' +
      '</div></div></div>' +
      '<i class="hacc__bar"></i>');
    list.appendChild(it);
    return it;
  });
  acc.appendChild(list);
  const buyLast = HOW.find(d => d.cta);
  if (buyLast) acc.appendChild(el('button','how__cta ds-btn ds-btn--primary ds-btn--block', buyLast.cta));
  how.appendChild(acc);

  const close = el('button','how__close', X);
  close.setAttribute('aria-label','סגירה');
  how.appendChild(close);

  let at = -1, chimeAt = null;
  /* the tick starts at 1.15s and runs .42s — the sound lands as it completes */
  const TICK_DONE = 1570;
  function show(i){
    if (i === at) return;
    at = i;
    clearTimeout(chimeAt);
    [...dots.children].forEach((b, j) => b.classList.toggle('on', j === i));
    /* the card redraws itself every time you come back to it, sound and all */
    steps.forEach((st, j) => st.classList.toggle('play', j === i));
    if (i === 1) chimeAt = setTimeout(chime, TICK_DONE);
  }
  track.addEventListener('scroll', () => requestAnimationFrame(() => {
    const mid = track.getBoundingClientRect().left + track.clientWidth / 2;
    let best = 0, dist = Infinity;
    steps.forEach((st, j) => {
      const r = st.getBoundingClientRect();
      const d = Math.abs(r.left + r.width / 2 - mid);
      if (d < dist) { dist = d; best = j; }
    });
    show(best);
  }), { passive:true });

  /* the accordion keeps its own place, and walks on every few seconds */
  const ACC_T = 6000;
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let accAt = -1, accNext = null;
  function openRow(i){
    accAt = i;
    clearTimeout(accNext); clearTimeout(chimeAt);
    rows.forEach((it, j) => {
      it.classList.remove('on', 'play');
      void it.offsetWidth;                   /* restarts the progress bar and the drawing */
      it.classList.toggle('on', j === i);
      it.classList.toggle('play', j === i);
      it.querySelector('.hacc__hd').setAttribute('aria-expanded', j === i);
    });
    if (i === 1) chimeAt = setTimeout(chime, TICK_DONE);
    if (!still.matches) accNext = setTimeout(() => openRow((accAt + 1) % rows.length), ACC_T);
  }
  rows.forEach((it, j) => it.querySelector('.hacc__hd').addEventListener('click', () => openRow(j)));
  acc.style.setProperty('--hacc-t', ACC_T / 1000 + 's');

  how._open  = () => {
    if (DESK.matches) { at = -1; openRow(0); }
    else { track.scrollLeft = 0; at = -1; show(0); }
  };
  how._quiet = () => { clearTimeout(chimeAt); clearTimeout(accNext); };
  how._close = close;
  return how;
}

function wireDeal(sl, d){

  const xd = XD_ALL[d.event.split(' · ')[0]] || [], city = d.event.split(' · ')[1] || '';

  /* the way on to the booking: followed by hand, so nothing over it on a phone can swallow the tap */
  go.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if (go.getAttribute('aria-disabled') !== 'true') location.href = go.href; });
  deal.querySelector('.buy__go').addEventListener('click', e => { e.preventDefault(); openDates(); });
  deal.querySelector('.xd-back').onclick = () => deal.classList.remove('xd--open');
  deal.addEventListener('click', e => {
    const t = e.target.closest('[data-xd]'); if (!t || t.disabled) return;
    const [a, b, p] = xd[+t.dataset.xd];
    deal.querySelectorAll('[data-xd]').forEach(n => n.classList.toggle('on', n === t));
    deal.querySelector('.xd-pick').innerHTML = '<span><bdi dir="ltr">' + a + '–' + b + '</bdi> · ' + nights(a, b) + ' לילות' + (city ? ' ב' + city.replace(/^ב/, '') : '') + '</span>'
      + '<span class="xd-pick__p">החל מ־<b>' + nfmt(p) + '<small>נק׳</small></b></span>';
    go.removeAttribute('aria-disabled');

  /* mobile: the sticky "קנה עכשיו" scrolls to the deal and opens the dates, then steps aside while the deal is in view */
  const sticky = sl.querySelector('.rd__go');
  if (sticky) {
    sticky.onclick = () => {
      openDates();
      /* bring the dates to the middle of the screen, not the top */
      requestAnimationFrame(() => {
        const r = deal.getBoundingClientRect(), box = sl.getBoundingClientRect();
        sl.scrollTo({ top: Math.max(0, sl.scrollTop + r.top - box.top - Math.max(16, (sl.clientHeight - r.height) / 2)), behavior: 'smooth' });
      });
    };
    if ('IntersectionObserver' in window)
      new IntersectionObserver(es => sl.classList.toggle('deal-in', es[0].isIntersecting), { root: sl, threshold: .35 }).observe(deal);
  }
}

    if (Math.abs(j - i) <= 1 && !v.src) v.src = v.dataset.src;   /* only the neighbours load */

const SOCIAL = [['Instagram','instagram'], ['Facebook','facebook'], ['WhatsApp','whatsapp']];
const FOOT_LEGAL = 'שימו לב, התוכן ו/או המידע בעמוד זה הינו דינאמי ומשתנה מעת לעת, כך שייתכן שהמידע ' +
  'כבר אינו רלוונטי נכון לרגעים אלו. יש לציין כי המידע המצוי בטקסטים אינו בגדר ייעוץ מקצועי ו/או ' +
  'עובדתי, אלא מבוסס על הידע המצוי בידי חברת FlyAll בעת כתיבתו. אין להתייחס למידע כמוחלט ו/או ' +
  'מחייב. המידע המדויק והעדכני ביותר לגבי הזמנתכם יופיע בעמוד הזמנת המוצר בלבד.';

function buildFoot(){
  const box = el('footer','foot');
  const groups = el('div','foot__groups');
  const groupEls = FOOT_GROUPS.map(([title, links, note]) => {
    const g = el('nav','foot__group', '<h4>'+title+'</h4>' +
      links.map(l => '<a href="#">'+l+'</a>').join('') +
      (note ? '<p class="foot__note"><span>'+note+'</span></p>' : ''));
    groups.appendChild(g);
    return g;
  });
  const follow = el('div','foot__group', '<h4>עקבו אחרינו</h4>' +
    '<div class="foot__social">' + SOCIAL.map(([name, f]) =>
      '<a href="#" aria-label="'+name+'"><img src="assets/social/'+f+'.svg" width="40" height="40" alt=""></a>'
    ).join('') + '</div>');
  groups.appendChild(follow);
  box.appendChild(groups);

  const rule = el('img','foot__rule');
  rule.src = 'assets/social/line.svg'; rule.alt = '';
  box.appendChild(rule);
  const legal = el('p','foot__legal', FOOT_LEGAL);
  box.appendChild(legal);

  enter(box, [...groupEls, follow, legal], 130);
  return box;
}

/* ---------------- mount ---------------- */
const stage = document.getElementById('stage');
const arc = buildArc(), list = buildList(), foot = buildFoot();
/* on desktop the title, the list and the player share one grid; below 1024px
   the wrapper is display:contents and the page stacks as before */
const split = el('div','split');
split.append(arc, list, list._player);
stage.appendChild(split);
stage.appendChild(foot);
requestAnimationFrame(() => { arc._shape && arc._shape(); });

/* The page opens straight into the lobby — there is no intro. The bar still
   floats in, and everything below it is released to its own on-arrival animation. */
const header = document.querySelector('.fa-header');
if (header) header.classList.add('rv');
let started = false;
function start(){
  if (started) return;
  started = true;
  if (header) header.classList.add('in');
  armEntries();                     /* sections start watching from here */
  arc._arm();                       /* and the rail's videos start playing */
}
/* a frame first, so the bar has an opacity to travel from — but never only a
   frame: a throttled rAF would leave the whole page invisible and inert */
requestAnimationFrame(start);
setTimeout(start, 120);

/* ================= demo · guest / signed-in switch (shared with the lobby) ================= */
(function(){
  const KEY = 'flyall-who';
  const PKEY = 'flyall-points';
  let mode = 'user', pm = 'earn';
  try { mode = localStorage.getItem(KEY) || 'user'; pm = localStorage.getItem(PKEY) || 'earn'; } catch(e){}
  const bar = el('div','who',
    '<button type="button" data-m="guest">אורח</button>' +
    '<button type="button" data-m="user">משתמש מזוהה</button>');
  bar.setAttribute('role','group');
  bar.setAttribute('aria-label','מצב תצוגה');
  function set(m){
    mode = m;
    document.body.classList.toggle('is-guest', m === 'guest');
    applyPts();
    bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
    try { localStorage.setItem(KEY, m); } catch(e){}
  }
  bar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(b.dataset.m); });
  document.body.appendChild(bar);
  set(mode);

  /* enough points to buy / still earning: moves the balance and shows the "you have enough" banner */
  const pbar = el('div','who who--pts',
    '<button type="button" data-p="earn">צבירת נקודות</button>' +
    '<button type="button" data-p="enough">מספיק נקודות</button>');
  pbar.setAttribute('role','group');
  pbar.setAttribute('aria-label','מצב נקודות');
  /* a guest has no points, so the "enough" banner and its room only apply when signed in */
  function applyPts(){
    if (pm === 'enough' && mode === 'user') document.documentElement.dataset.points = 'enough';
    else delete document.documentElement.dataset.points;
  }
  function setPts(m){
    pm = m;
    applyPts();
    document.querySelectorAll('.lead__me').forEach(n => n._paint && n._paint());   /* the ring follows the switch */
    pbar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.p === m));
    try { localStorage.setItem(PKEY, m); } catch(e){}
  }
  pbar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setPts(b.dataset.p); });
  document.body.appendChild(pbar);
  setPts(pm);
  /* BNPL / no BNPL: without it there's no deposit box — the experience opens on its dates */
  const BKEY = 'flyall-bnpl';
  let bm = 'on';
  try { bm = localStorage.getItem(BKEY) || 'on'; } catch(e){}
  const bbar = el('div','who who--bnpl',
    '<button type="button" data-b="on">BNPL</button>' +
    '<button type="button" data-b="off">ללא BNPL</button>');
  bbar.setAttribute('role','group');
  bbar.setAttribute('aria-label','מצב תשלום');
  function setBnpl(m){
    bm = m;
    if (m === 'off') document.documentElement.dataset.bnpl = 'off'; else delete document.documentElement.dataset.bnpl;
    bbar.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.b === m));
    try { localStorage.setItem(BKEY, m); } catch(e){}
  }
  bbar.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setBnpl(b.dataset.b); });
  document.body.appendChild(bbar);
  setBnpl(bm);
})();
</script>
</body>
</html>
